<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revisão Multidisciplinar — Pedro Katsumi (6º Ano)</title>

  <!-- =========================================================
       ESTILO
       Organizado em blocos:
       1. Variáveis e reset
       2. Layout geral (header, nav, main)
       3. Cards e seções retráteis (accordion)
       4. Exercícios (múltipla escolha e resposta curta)
       5. Feedback visual (acerto, erro, modelo)
       6. Barra de progresso
       7. Responsividade
       ========================================================= -->
  <style>
    /* ---------- 1. Variáveis e reset ---------- */
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --text: #1f2937;
      --text-soft: #4b5563;
      --muted: #94a3b8;

      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --primary-strong: #3730a3;

      --success: #16a34a;
      --success-soft: #dcfce7;
      --error: #ea580c;
      --error-soft: #ffedd5;
      --info: #0ea5e9;
      --info-soft: #e0f2fe;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.25; color: var(--text); }
    p { margin: 0 0 .8em; color: var(--text-soft); }
    ul { margin: 0 0 .8em 1.2em; color: var(--text-soft); }
    li { margin-bottom: .25em; }

    button { font: inherit; cursor: pointer; }

    /* ---------- 2. Layout geral ---------- */
    .page-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      padding: 28px 20px;
      box-shadow: var(--shadow-md);
    }
    .page-header__inner {
      max-width: 1080px;
      margin: 0 auto;
    }
    .page-header h1 {
      color: white;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      margin-bottom: 6px;
    }
    .page-header .subtitle {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .page-header .notice {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 999px;
      color: white;
      font-size: .9rem;
    }

    .nav-tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .nav-tabs__inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      column-gap: 8px;
      row-gap: 8px;
    }
    .nav-tabs button {
      flex: 0 0 auto;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-soft);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 500;
      transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
      white-space: nowrap;
    }
    .nav-tabs button:hover {
      background: var(--primary-soft);
      color: var(--primary-strong);
      border-color: var(--primary-soft);
    }
    .nav-tabs button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
    }
    .nav-tabs button .tab-icon {
      margin-right: 6px;
      opacity: .9;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* ---------- 3. Cards e seções retráteis ---------- */
    .subject-panel { display: none; }
    .subject-panel.active { display: block; animation: fadeIn .25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .subject-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .subject-header h2 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subject-header .subject-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-weight: 700;
    }

    .accordion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .accordion__header {
      width: 100%;
      background: var(--surface);
      border: none;
      text-align: left;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
      transition: background .15s ease;
    }
    .accordion__header:hover { background: var(--surface-soft); }
    .accordion__header .chevron {
      transition: transform .2s ease;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .accordion.open .accordion__header .chevron { transform: rotate(90deg); color: var(--primary); }

    .accordion__body {
      display: none;
      padding: 4px 18px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .accordion.open .accordion__body { display: block; }

    /* Switch Resumo / Conteúdo geral */
    .content-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin: 14px 0 8px;
    }
    .content-switch__btn {
      border: none;
      background: transparent;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .content-switch__btn:hover { color: var(--primary-strong); }
    .content-switch__btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .content-view { display: none; }
    .content-view.active { display: block; }

    .section-intro {
      background: var(--info-soft);
      border-left: 4px solid var(--info);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin: 12px 0 16px;
      color: #075985;
    }

    /* Tabelas dentro das seções (quadros de conjugação etc.) */
    .accordion__body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: .95rem;
      background: var(--surface);
    }
    .accordion__body th,
    .accordion__body td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .accordion__body th {
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-weight: 600;
    }
    .accordion__body h3 {
      margin-top: 18px;
      font-size: 1.05rem;
      color: var(--primary-strong);
    }
    .accordion__body h3:first-child { margin-top: 6px; }

    /* Caixas "Lembre-se" e "Atenção" */
    .callout {
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin: 12px 0;
      border-left: 4px solid;
      font-size: .95rem;
    }
    .callout strong { display: block; margin-bottom: 4px; }
    .callout--remember {
      background: var(--info-soft);
      border-color: var(--info);
      color: #075985;
    }
    .callout--attention {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #78350f;
    }

    /* Palavras destacadas (ex.: was, were, there was) */
    .hl {
      background: var(--primary-soft);
      color: var(--primary-strong);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .95em;
    }
    .hl--ok  { background: var(--success-soft); color: #166534; }
    .hl--no  { background: var(--error-soft);   color: #9a3412; }

    /* ---------- 4. Exercícios ---------- */
    .exercise {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 16px 14px;
      margin-bottom: 14px;
    }
    .exercise__label {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .exercise__question {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      white-space: pre-line;
    }

    /* Múltipla escolha */
    .options { display: grid; gap: 8px; margin-bottom: 12px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .option:hover { border-color: var(--primary); background: var(--primary-soft); }
    .option input { margin-top: 4px; accent-color: var(--primary); }
    .option.selected { border-color: var(--primary); background: var(--primary-soft); }
    .option.correct { border-color: var(--success); background: var(--success-soft); }
    .option.incorrect { border-color: var(--error); background: var(--error-soft); }

    /* Resposta curta */
    .short-answer textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font: inherit;
      resize: vertical;
      background: var(--surface);
      color: var(--text);
    }
    .short-answer textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* Botões dos exercícios */
    .exercise__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      font-weight: 600;
      font-size: .92rem;
      transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: var(--primary); color: white; }
    .btn--primary:hover { background: var(--primary-strong); }
    .btn--ghost {
      background: transparent;
      color: var(--primary-strong);
      border: 1px solid var(--primary-soft);
    }
    .btn--ghost:hover { background: var(--primary-soft); }

    /* ---------- 5. Feedback ---------- */
    .feedback {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback--success {
      background: var(--success-soft);
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .feedback--error {
      background: var(--error-soft);
      color: #9a3412;
      border: 1px solid #fed7aa;
    }
    .feedback--info {
      background: var(--info-soft);
      color: #075985;
      border: 1px solid #bae6fd;
    }

    .model-answer {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: #fef9c3;
      border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      color: #78350f;
    }
    .model-answer.show { display: block; }
    .model-answer h4 {
      margin: 0 0 6px;
      color: #78350f;
      font-size: .95rem;
    }

    /* ---------- 6. Barra de progresso ---------- */
    .progress {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      min-width: 240px;
    }
    .progress__label {
      font-size: .85rem;
      color: var(--text-soft);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress__bar {
      width: 100%;
      height: 8px;
      background: var(--surface-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress__fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      transition: width .3s ease;
    }

    /* ---------- 7. Simulado da PI ---------- */
    .nav-tabs button.tab--simulado {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: white;
      border-color: transparent;
      font-weight: 600;
    }
    .nav-tabs button.tab--simulado:hover { color: white; opacity: .92; }
    .nav-tabs button.tab--simulado.active {
      background: linear-gradient(135deg, #ea580c, #b45309);
      box-shadow: 0 2px 6px rgba(234, 88, 12, .35);
    }

    .sim-text {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }
    .sim-text h3 {
      color: var(--primary-strong);
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    .sim-text p { margin-bottom: .8em; }

    .sim-block { margin-bottom: 22px; }
    .sim-block__title {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary-strong);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    .sim-question {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .sim-question__head {
      font-size: .78rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .04em;
    }
    .sim-question__text {
      font-weight: 600;
      color: var(--text);
      margin: 4px 0 10px;
    }

    .sim-options { display: grid; gap: 6px; }
    .sim-option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .sim-option:hover { border-color: var(--primary); background: var(--primary-soft); }
    .sim-option input { margin-top: 4px; accent-color: var(--primary); }
    .sim-option.selected   { border-color: var(--primary); background: var(--primary-soft); }
    .sim-option.correct    { border-color: var(--success); background: var(--success-soft); }
    .sim-option.incorrect  { border-color: var(--error);   background: var(--error-soft); }

    .sim-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 20px;
    }

    .sim-result {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }
    .sim-result.show { display: block; animation: fadeIn .25s ease; }
    .sim-result h3 { color: var(--primary-strong); margin-bottom: 6px; }
    .sim-result h4 { margin: 14px 0 8px; }
    .sim-result__total {
      font-size: 1.15rem;
      margin-bottom: 4px;
    }
    .sim-result__total strong { color: var(--primary-strong); }
    .sim-result__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }
    .sim-score {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-size: .92rem;
    }
    .sim-score strong { font-size: 1.05rem; }
    .sim-score--ok  { border-color: #bbf7d0; background: var(--success-soft); }
    .sim-score--ok  strong { color: var(--success); }
    .sim-score--med { border-color: #fde68a; background: #fef9c3; }
    .sim-score--med strong { color: #ca8a04; }
    .sim-score--low { border-color: #fed7aa; background: var(--error-soft); }
    .sim-score--low strong { color: var(--error); }

    /* ---------- 8. Responsividade ---------- */
    @media (max-width: 600px) {
      .page-header { padding: 20px 16px; }
      main { padding: 16px 14px 60px; }
      .accordion__header { padding: 14px; font-size: .98rem; }
      .exercise { padding: 14px; }
      .subject-header h2 { font-size: 1.25rem; }
      .sim-text { padding: 14px 16px; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       1. CABEÇALHO
       ========================================================= -->
  <header class="page-header">
    <div class="page-header__inner">
      <h1>Revisão Multidisciplinar — Pedro Katsumi (6º Ano)</h1>
      <p class="subtitle">
        Um percurso de estudo para revisar os principais conteúdos da prova,
        organizado por disciplina, com explicações, resumos e exercícios interativos.
      </p>
      <span class="notice">
        Você pode seguir o percurso completo ou abrir apenas as partes que quiser revisar.
      </span>
    </div>
  </header>

  <!-- =========================================================
       2. NAVEGAÇÃO POR DISCIPLINAS
       Os botões são gerados dinamicamente pelo JavaScript.
       ========================================================= -->
  <nav class="nav-tabs" aria-label="Disciplinas">
    <div class="nav-tabs__inner" id="nav-tabs"></div>
  </nav>

  <!-- =========================================================
       3. CONTEÚDO PRINCIPAL
       Cada disciplina é renderizada como um <section> dentro de #content.
       ========================================================= -->
  <main id="content"></main>

  <!-- =========================================================
       SCRIPT
       Organizado em blocos:
       1. Dados das disciplinas (subjects)
       2. Renderização de abas e painéis
       3. Renderização de seções (accordion)
       4. Renderização de exercícios (múltipla escolha + resposta curta)
       5. Lógica de verificação de respostas
       6. Cálculo de progresso
       7. Inicialização
       ========================================================= -->
  <script>
    /* =========================================================
       1. DADOS DAS DISCIPLINAS
       Para inserir conteúdo real depois, basta editar este objeto.
       Cada disciplina tem:
         - title: nome exibido
         - icon: símbolo curto exibido na aba
         - sections: { percurso, explicacao, resumo, dicas }
         - exercises: [ { type, question, ... } ]

       Tipos de exercício suportados:
         - "multiple-choice":
             { type, question, options: [...], correctAnswer: indice,
               explanation, modelAnswer }
         - "short-answer":
             { type, question, keywords: [...], explanation, modelAnswer }
       ========================================================= */
    const subjects = {
      ingles: {
        title: "Inglês",
        icon: "EN",
        sections: {
          percurso: `
            <p>Conteúdo da <strong>Unit 2</strong> (Macmillan): passado simples do verbo <em>be</em>, <em>there was/there were</em>, gerúndios e vocabulário de cômodos, móveis e gadgets.</p>
            <ol>
              <li>Comece pelo <strong>Resumo</strong> para ver os quadros de was/were e there was/there were.</li>
              <li>Depois leia a <strong>Explicação geral</strong> para entender quando usar cada forma.</li>
              <li>Faça os <strong>exercícios</strong> sem olhar a resposta.</li>
              <li>Use o botão <em>Mostrar resposta/modelo</em> só depois de tentar.</li>
              <li>Por fim, leia as <strong>Dicas finais de prova</strong>.</li>
            </ol>`,

          explicacao: `
            <h3>1. Be: Simple Past (was / were)</h3>
            <p>Usamos <span class="hl">was</span> e <span class="hl">were</span> para falar de situações no <strong>passado</strong>.</p>
            <ul>
              <li><span class="hl">was</span> → para <em>I, He, She, It</em>. Exemplo: <em>He <span class="hl">was</span> at home yesterday.</em></li>
              <li><span class="hl">were</span> → para <em>You, We, They</em>. Exemplo: <em>They <span class="hl">were</span> in Paris three weeks ago.</em></li>
              <li>Negativo: acrescente <strong>not</strong>. Forma curta: <span class="hl--no">wasn't</span> e <span class="hl--no">weren't</span>. Exemplo: <em>She <span class="hl--no">wasn't</span> in the kitchen.</em></li>
              <li>Pergunta: a ordem das palavras muda — o verbo vem antes do sujeito. <em>You were at home</em> → <em><span class="hl">Were</span> you at home?</em></li>
            </ul>

            <h3>2. There was / There were</h3>
            <p>Usam-se para dizer que algo <strong>existia</strong> no passado (parecido com o nosso "havia / existia").</p>
            <ul>
              <li><span class="hl">There was</span> + substantivo no <strong>singular</strong> ou <strong>incontável</strong>.<br>
                  Ex.: <em>There <span class="hl">was</span> a kitchen.</em> / <em>There <span class="hl">was</span> heating.</em></li>
              <li><span class="hl">There were</span> + substantivo no <strong>plural</strong>.<br>
                  Ex.: <em>There <span class="hl">were</span> five chairs.</em></li>

            <h3>1. A Terra no Sistema Solar</h3>
            <p>O Universo é formado por bilhões de <strong>galáxias</strong>. Nossa galáxia se chama <span class="hl">Via Láctea</span>, e dentro dela está o <strong>Sistema Solar</strong>.</p>
            <p>O Sistema Solar é formado pelo <strong>Sol</strong> (uma estrela) e por <strong>oito planetas</strong> que giram ao seu redor: <em>Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano e Netuno</em>. Existem ainda <strong>asteroides, meteoroides, cometas e satélites</strong> (naturais, como a Lua, ou artificiais, fabricados pelos humanos).</p>
            <p>Em <strong>2006</strong>, Plutão foi reclassificado como <strong>planeta-anão</strong> pela União Astronômica Internacional (UAI).</p>

            <h3>2. Distâncias e Teoria Heliocêntrica</h3>
            <ul>
              <li>Distância da Terra ao Sol: cerca de <strong>150 milhões de km</strong>.</li>
              <li>Distância da Terra à Lua: cerca de <strong>384 mil km</strong>.</li>
              <li>A luz do Sol leva <strong>8 minutos e 18 segundos</strong> para chegar à Terra.</li>
            </ul>
            <p>Até o século XVI, acreditava-se que a Terra era o centro do Universo. O astrônomo polonês <strong>Nicolau Copérnico</strong> (1473–1543) propôs a <span class="hl">Teoria Heliocêntrica</span> (do grego <em>hélio</em> = Sol), mostrando que o Sol é o centro do Sistema Solar e que os planetas giram ao seu redor.</p>

            <h3>3. Origem e idade da Terra</h3>
            <p>Segundo a <strong>teoria das nebulosas</strong>, o Sistema Solar surgiu a partir de uma grande nuvem de gases e poeira cósmica que se contraiu e formou o Sol. Outra parte dessa nebulosa formou os planetas.</p>
            <p>A Terra tem cerca de <strong>4,6 bilhões de anos</strong>. No início, ela era uma bola incandescente. Conforme foi esfriando, formou-se a <strong>crosta terrestre</strong>, e a liberação de vapor e gases originou a <strong>atmosfera</strong>. Quando esse vapor d'água se condensou, choveu por muito tempo e formaram-se os <strong>oceanos</strong>.</p>

            <h3>4. Estrutura interna da Terra</h3>
            <p>Por <strong>composição química</strong>, a Terra é dividida em três camadas:</p>
            <ul>
              <li><span class="hl">Crosta</span>: camada externa, fina e sólida. Pode ser <em>continental</em> (mais antiga e espessa, 30 a 70 km) ou <em>oceânica</em> (mais densa e recente, 5 a 10 km).</li>
              <li><span class="hl">Manto</span>: cerca de 2.900 km de espessura, com minerais ricos em silício, ferro e magnésio.</li>
              <li><span class="hl">Núcleo</span>: cerca de 3.500 km. Externo (líquido, em altas temperaturas) e interno (sólido, liga de ferro e níquel). A temperatura ultrapassa <strong>5.000 °C</strong>.</li>
            </ul>
            <p>Por <strong>características físicas</strong>, dividimos em quatro camadas: <em>litosfera, astenosfera, mesosfera e endosfera</em>.</p>

            <h3>5. Tectônica de placas e Deriva continental</h3>
            <p>A <strong>litosfera</strong> é fragmentada em grandes blocos chamados <span class="hl">placas tectônicas</span>, que flutuam sobre a astenosfera. Elas se movem por causa das <strong>correntes de convecção</strong> do manto.</p>
            <p>No início do século XX, o alemão <strong>Alfred Wegener</strong> (1880–1930) propôs a <span class="hl">Teoria da Deriva Continental</span>: há centenas de milhões de anos, todos os continentes formavam um só, chamado <strong>Pangeia</strong>, rodeado por um único oceano, a <strong>Pantalassa</strong>. Depois ele se dividiu em <em>Laurásia</em> (norte) e <em>Gondwana</em> (sul).</p>
            <p>Wegener morreu antes que sua hipótese fosse aceita. Hoje, ela foi aprimorada e deu origem à <strong>Teoria da Tectônica de Placas</strong>.</p>

              <li><strong>Áreas de separação</strong>: as placas se afastam, libera-se magma e formam-se novas rochas (ex.: Dorsal Mesoatlântica).</li>
              <li><strong>Áreas de choque</strong>: as placas colidem, dobrando a borda e formando cadeias de montanhas; podem aparecer fósseis marinhos no alto.</li>
              <li>Essas regiões são <strong>instáveis</strong> e sujeitas a <strong>terremotos e vulcões</strong>. Por isso o Brasil quase não tem vulcões nem terremotos fortes: estamos no meio de uma placa.</li>
            </ul>

            <h3>6. Rochas e minerais</h3>
            <p>A crosta é feita de <strong>rochas</strong> (aglomerados naturais de minerais). Existem três tipos:</p>

              <li><span class="hl">Magmáticas (ou ígneas)</span>: vêm do <strong>resfriamento do magma</strong>. Se solidificam na superfície (vulcânicas) ou dentro da crosta (plutônicas). Ex.: <em>granito</em>.</li>
              <li><span class="hl">Sedimentares</span>: formadas pelo <strong>acúmulo e compactação de sedimentos</strong> ao longo do tempo. Processo lento.</li>
              <li><span class="hl">Metamórficas</span>: outras rochas <strong>transformadas</strong> por altas temperaturas e/ou pressão. Ex.: granito → <em>gnaisse</em>; calcário → <em>mármore</em>.</li>
            </ul>
            <p>Esse vai-e-vem entre os tipos é o <strong>ciclo das rochas</strong>.</p>

            <h3>7. Agentes transformadores do relevo</h3>
            <ul>
              <li><strong>Internos (endógenos)</strong>: vêm de <em>dentro</em> da Terra. São o <em>tectonismo</em>, o <em>vulcanismo</em> e os <em>terremotos</em>. <strong>Constroem</strong> o relevo.</li>
              <li><strong>Externos (exógenos)</strong>: agem <em>na superfície</em> — água, vento, gelo, seres vivos (em especial o ser humano). <strong>Desgastam</strong> o relevo. Inclui o <em>intemperismo</em> (alterações físicas e químicas das rochas) e a <em>erosão</em> (desgaste, transporte e deposição de sedimentos).</li>

            <h3>8. Formas do relevo</h3>

            <h3>1. Potenciação (Módulo 6)</h3>
            <p>A <strong>potenciação</strong> é uma forma curta de escrever uma multiplicação em que <em>todos os fatores são iguais</em>.</p>
            <p>Exemplo: em vez de escrever <span class="hl">2 × 2 × 2 = 8</span>, escrevemos <span class="hl">2³ = 8</span>.</p>
            <ul>
              <li><strong>Base</strong>: o fator que se repete (no exemplo, é o <strong>2</strong>).</li>
              <li><strong>Expoente</strong>: indica quantas vezes a base se repetiu (no exemplo, é o <strong>3</strong>).</li>
              <li><strong>Potência</strong>: o resultado da operação (no exemplo, <strong>8</strong>).</li>
            </ul>

            <h4>Como ler uma potência</h4>
            <ul>
              <li>3² → "três elevado à <strong>segunda</strong> potência" ou "três <strong>ao quadrado</strong>".</li>
              <li>4³ → "quatro elevado à <strong>terceira</strong> potência" ou "quatro <strong>ao cubo</strong>".</li>
              <li>5⁴ → "cinco elevado à <strong>quarta</strong> potência".</li>
              <li>6⁵ → "seis elevado à <strong>quinta</strong> potência". E assim por diante.</li>
            </ul>

            <h4>Propriedades das potências de mesma base</h4>
            <ul>
              <li><strong>Multiplicação</strong>: conserva-se a base e <span class="hl">somam-se</span> os expoentes.<br>
                  Ex.: 5² × 5⁴ = 5<sup>2+4</sup> = <strong>5⁶</strong>.</li>
              <li><strong>Divisão</strong>: conserva-se a base e <span class="hl">subtraem-se</span> os expoentes.<br>
                  Ex.: 5⁵ ÷ 5² = 5<sup>5−2</sup> = <strong>5³</strong>.</li>
            </ul>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              Todo número diferente de zero elevado a <strong>zero</strong> é igual a <strong>1</strong>. Exemplos: 7⁰ = 1, 100⁰ = 1, 25⁰ = 1.
            </div>

            <h3>2. Medida de tempo (Módulo 7)</h3>
            <p>Trabalhamos com três unidades principais: <strong>hora (h)</strong>, <strong>minuto (min)</strong> e <strong>segundo (s)</strong>. Elas seguem o <span class="hl">sistema sexagesimal</span> (de base 60), herança dos babilônios.</p>
            <ul>
              <li>1 dia = <strong>24 horas</strong></li>
              <li>1 hora = <strong>60 minutos</strong></li>
              <li>1 minuto = <strong>60 segundos</strong></li>
            </ul>

            <h4>Adição e subtração</h4>
            <p>Some/subtraia separadamente as unidades correspondentes (h com h, min com min, s com s). Quando passar de 60 segundos ou 60 minutos, faça a <strong>troca</strong>.</p>
            <p><strong>Exemplo:</strong> 14 h 50 min + 1 h 30 min</p>
            <ul>
              <li>50 min + 30 min = 80 min → 80 min = 1 h e 20 min</li>
              <li>14 h + 1 h + 1 h = 16 h</li>
              <li>Resultado: <strong>16 h 20 min</strong>.</li>
            </ul>
            <p>Na <strong>subtração</strong>, quando o minuendo é menor que o subtraendo, é preciso "pegar emprestado": tirar 1 h (60 min) e somar aos minutos.</p>

            <h4>Transformação de unidades</h4>
            <p>Para passar segundos para minutos, divide-se por 60. Para passar minutos para horas, também por 60.</p>
            <p><strong>Exemplo:</strong> 4 236 s = quanto em h, min e s?</p>
            <ul>
              <li>4 236 ÷ 60 = 70 min e sobram 36 s.</li>
              <li>70 ÷ 60 = 1 h e sobram 10 min.</li>
              <li>Resultado: <strong>1 h 10 min 36 s</strong>.</li>
            </ul>

            <h3>3. Análise de dados (Módulo 9)</h3>
            <p>Existem vários tipos de gráfico, e cada um serve melhor para uma situação:</p>
            <ul>
              <li><strong>Gráfico de barras (ou colunas)</strong>: bom para <em>comparar quantidades</em> entre categorias (ex.: desmatamento por estado).</li>
              <li><strong>Gráfico de linhas</strong>: bom para mostrar a <em>evolução ao longo do tempo</em> (ex.: desmatamento ano a ano).</li>
              <li><strong>Gráfico circular (pizza)</strong>: bom para mostrar <em>partes de um todo</em> (porcentagens).</li>
            </ul>
            <p>Para <strong>ler</strong> um gráfico, observe:</p>
            <ul>
              <li>O <strong>título</strong> e a <strong>fonte</strong> dos dados.</li>
              <li>O que está nos <strong>eixos</strong> (o que cada barra/ponto representa) e a <strong>unidade</strong>.</li>
              <li>A <strong>legenda</strong> (cores e símbolos).</li>
              <li>O <strong>período</strong> a que os dados se referem.</li>
            </ul>

            <h3>4. Números racionais (Módulo 13)</h3>
            <p>Os números <strong>racionais</strong> podem ser representados como fração (1/2) ou como decimal (0,5). Todo número natural também pode ser escrito como decimal: 3 = 3,0.</p>

            <h4>Comparação de decimais</h4>
            <ul>
              <li>Acrescentar <strong>zeros à direita</strong> do último algarismo após a vírgula <span class="hl--ok">não muda o valor</span>: 0,3 = 0,30 = 0,300.</li>
              <li>Acrescentar zero <strong>entre a vírgula e o número</strong> muda o valor: 0,2 ≠ 0,02 (0,2 é dez vezes maior).</li>
              <li>Para comparar, alinhe pela vírgula e olhe casa a casa, da esquerda para a direita: 0,805 &gt; 0,085 (porque 8 décimos &gt; 0 décimos).</li>
            </ul>

            <h4>Reta numérica</h4>
            <p>Na <strong>reta numérica</strong>, escolhemos um ponto chamado de <span class="hl">origem</span> (representa o 0) e definimos uma <strong>unidade de medida</strong> à direita. Os números crescem para a <strong>direita</strong>. Decimais ficam <em>entre</em> os naturais (ex.: 7,5 fica entre 7 e 8, no meio).</p>

            <h4>Sequências e regularidades</h4>
            <p>Em sequências de decimais, observe a <strong>diferença</strong> entre dois termos consecutivos para descobrir a regra.</p>
            <p><strong>Exemplo:</strong> 4,0 • 3,75 • 3,5 • ... → cada termo diminui <strong>0,25</strong>. O próximo é <strong>3,25</strong>.</p>

            <div class="callout callout--attention">
              <strong>Atenção</strong>
              Cuidado com a posição da vírgula. <em>0,2 e 0,02</em> parecem iguais à primeira vista, mas são bem diferentes. Olhe sempre quantas casas existem entre a vírgula e o algarismo.
            </div>

            <h3>5. Multiplicação e divisão por potências de 10 (Módulo 14)</h3>
            <p>Os números 10, 100, 1 000, 10 000... são <strong>potências de 10</strong>:</p>
            <ul>
              <li>10 = 10¹</li>
              <li>100 = 10²</li>
              <li>1 000 = 10³</li>
              <li>10 000 = 10⁴ … e assim por diante.</li>
            </ul>

            <h4>Multiplicar por uma potência de 10</h4>
            <p>Basta <strong>mover a vírgula para a direita</strong> tantas casas quanto o número de zeros (ou tantas casas quanto o expoente).</p>
            <ul>
              <li>4,528 × <span class="hl">10</span> = <strong>45,28</strong> (1 casa para a direita)</li>
              <li>4,528 × <span class="hl">100</span> = <strong>452,8</strong> (2 casas)</li>
              <li>4,528 × <span class="hl">1 000</span> = <strong>4 528</strong> (3 casas — sumiu a vírgula)</li>
              <li>0,027 × 1 000 = <strong>27</strong></li>
            </ul>
            <p>Em números <em>inteiros</em>, "mover a vírgula" é o mesmo que <strong>acrescentar zeros à direita</strong>: 4 528 × 100 = <strong>452 800</strong>.</p>

            <h4>Dividir por uma potência de 10</h4>
            <p>Basta <strong>mover a vírgula para a esquerda</strong> tantas casas quanto o número de zeros.</p>
            <ul>
              <li>325 ÷ <span class="hl">10</span> = <strong>32,5</strong> (1 casa)</li>
              <li>325 ÷ <span class="hl">100</span> = <strong>3,25</strong> (2 casas)</li>
              <li>325 ÷ <span class="hl">1 000</span> = <strong>0,325</strong> (3 casas)</li>
              <li>31,98 ÷ 10 = <strong>3,198</strong></li>
            </ul>
            <p>Quando faltam casas para mover a vírgula, completa-se com zeros à esquerda: 4 ÷ 100 = <strong>0,04</strong>.</p>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              <strong>Multiplicar</strong> por 10, 100, 1 000... <em>aumenta</em> o número (vírgula vai para a <span class="hl--ok">direita</span>).<br>
              <strong>Dividir</strong> por 10, 100, 1 000... <em>diminui</em> o número (vírgula vai para a <span class="hl--no">esquerda</span>).
            </div>

            <h3>6. Estratégias de cálculo com porcentagem (Módulo 15)</h3>
            <p>O símbolo <strong>%</strong> significa "<em>por cento</em>", isto é, "em cada 100". Logo:</p>
            <ul>
              <li>10% = <strong>10/100</strong> = <strong>0,10</strong> = "10 em cada 100"</li>
              <li>"10% de 50 pessoas" significa: a cada 100 pessoas, 10 — então em 50 pessoas seriam 5.</li>
            </ul>

            <h4>Equivalências importantes</h4>
            <ul>
              <li><strong>100%</strong> = o todo (1 inteiro)</li>
              <li><strong>50%</strong> = a metade (÷ 2)</li>
              <li><strong>25%</strong> = um quarto (÷ 4)</li>
              <li><strong>75%</strong> = três quartos</li>
              <li><strong>10%</strong> = um décimo (÷ 10)</li>
              <li><strong>20%</strong> = um quinto (÷ 5)</li>
              <li><strong>1%</strong> = um centésimo (÷ 100)</li>
            </ul>

            <h4>Estratégias para calcular de cabeça</h4>
            <p><strong>Exemplo 1:</strong> 75% de 32?</p>
            <ul>
              <li>Como 75% = 3/4, fazemos 32 ÷ 4 = 8 e depois 3 × 8 = <strong>24</strong>.</li>
              <li>Outro caminho: 50% de 32 = 16; 25% = 8; 75% = 16 + 8 = <strong>24</strong>.</li>
            </ul>
            <p><strong>Exemplo 2:</strong> 24% de 700?</p>
            <ul>
              <li>10% de 700 = 70 (basta dividir por 10).</li>
              <li>20% de 700 = 2 × 70 = 140.</li>
              <li>1% de 700 = 7. Logo 4% = 4 × 7 = 28.</li>
              <li>24% = 20% + 4% = 140 + 28 = <strong>168</strong>.</li>
            </ul>

            <h4>Porcentagem nas finanças</h4>
            <p>Em compras, <strong>desconto</strong> e <strong>juros</strong> aparecem em forma de porcentagem.</p>
            <ul>
              <li>Pagar com 8% de desconto em uma conta de R$ 800: 8% de 800 = 64. Pago: 800 − 64 = <strong>R$ 736</strong>.</li>
              <li>Juros de 1% por dia de atraso em uma conta de R$ 120: 1% de 120 = R$ 1,20. Em 10 dias: 10 × 1,20 = <strong>R$ 12</strong> a mais.</li>
            </ul>

            <h3>1. O que é um poliedro?</h3>
            <p>Um <span class="hl">poliedro</span> é uma figura sólida (em três dimensões) cujas faces são todas polígonos planos. Exemplos: cubo, paralelepípedo, pirâmides e prismas.</p>
            <p>Em todo poliedro existem três elementos que vamos contar:</p>
            <ul>
              <li><strong>Vértices (V)</strong>: os <em>pontos</em> onde várias arestas se encontram (são os "cantinhos").</li>
              <li><strong>Faces (F)</strong>: cada <em>polígono</em> plano que forma o poliedro.</li>
              <li><strong>Arestas (A)</strong>: as <em>linhas</em> em que duas faces se encontram.</li>
            </ul>

            <h3>2. Relação de Euler</h3>
            <p>O matemático suíço <strong>Leonhard Euler</strong> (século XVIII) descobriu uma relação que vale para <em>todo poliedro convexo</em> (sem "buracos"):</p>
            <p style="text-align: center; font-size: 1.3rem; margin: 14px 0;">
              <span class="hl">V + F = A + 2</span>
            </p>
            <p>Ou seja, se você somar o número de vértices com o número de faces, sempre vai dar dois a mais do que o número de arestas.</p>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              A fórmula pode ser usada de três jeitos, dependendo do que falta:<br>
              • Para achar <strong>A</strong>: <span class="hl">A = V + F − 2</span><br>
              • Para achar <strong>F</strong>: <span class="hl">F = A + 2 − V</span><br>
              • Para achar <strong>V</strong>: <span class="hl">V = A + 2 − F</span>
            </div>

            <h3>3. Exemplo passo a passo</h3>
            <p><strong>Pergunta:</strong> Um poliedro tem 14 vértices e 9 faces. Quantas arestas?</p>
            <ol>
              <li>Aplico a fórmula: V + F = A + 2.</li>
              <li>Substituo os valores: 14 + 9 = A + 2.</li>
              <li>Faço a soma: 23 = A + 2.</li>
              <li>Isolo o A: A = 23 − 2 = <strong>21 arestas</strong>.</li>
            </ol>

            <h3>4. Como contar V, F e A nos sólidos mais comuns</h3>
            <ul>
              <li><strong>Cubo</strong> (e paralelepípedo): tem 4 cantos em cima e 4 embaixo → <strong>V = 8</strong>. As faces são 2 (em cima e embaixo) + 4 (laterais) → <strong>F = 6</strong>. Há 4 arestas em cima, 4 embaixo e 4 verticais → <strong>A = 12</strong>.</li>

              <li><strong>Pirâmide de base triangular</strong> (tetraedro): <strong>V = 4</strong>, <strong>F = 4</strong>, <strong>A = 6</strong>.</li>
              <li><strong>Prisma de base triangular</strong>: 3 vértices em cima + 3 embaixo → <strong>V = 6</strong>. 2 bases triangulares + 3 faces retangulares laterais → <strong>F = 5</strong>. 3 arestas em cima, 3 embaixo, 3 verticais → <strong>A = 9</strong>.</li>
              <li><strong>Prisma de base pentagonal</strong>: 5 + 5 → <strong>V = 10</strong>. 2 bases + 5 laterais → <strong>F = 7</strong>. 5 + 5 + 5 → <strong>A = 15</strong>.</li>
            </ul>
            <p>Em todos eles, conferindo: <em>V + F − A = 2</em>. Sempre!</p>
          `,

          explicacao: `
            <h3>1. Ciências como processo investigativo (Módulo 1)</h3>
            <p>As Ciências da Natureza tentam explicar fatos e fenômenos do mundo. Para isso, os cientistas usam um caminho organizado, chamado <span class="hl">método científico</span>, que tem quatro grandes etapas:</p>
            <ol>
              <li><strong>Observação</strong> — perceber o fenômeno e fazer perguntas sobre ele.</li>
              <li><strong>Hipótese</strong> — propor uma explicação possível para o que se observou.</li>
              <li><strong>Experimento</strong> — testar a hipótese em condições controladas.</li>
              <li><strong>Conclusão</strong> — analisar os resultados para <em>validar</em> ou <em>reformular</em> a hipótese.</li>
            </ol>
            <p>Quando uma hipótese é confirmada por muitas evidências e experimentos, ela pode se transformar em uma <strong>teoria</strong> (ou até em uma <strong>lei</strong>). Quando não é confirmada, é reformulada.</p>

            <h4>Variáveis, grupo controle e grupo experimental</h4>
            <p>Em um experimento, mantemos quase tudo igual entre dois grupos e mudamos só um detalhe (a <strong>variável</strong>) para saber qual é o efeito dele.</p>
            <ul>
              <li><strong>Grupo experimental</strong>: recebe o fator que estamos estudando (ex.: água).</li>
              <li><strong>Grupo controle</strong>: NÃO recebe esse fator. Serve de comparação.</li>
            </ul>
            <p><em>Exemplo da apostila:</em> dois copos com sementes de feijão. Um recebe água (experimental), o outro não recebe (controle). Se só o copo com água germinar, concluímos que a água é necessária para a germinação.</p>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              No século XVII, o médico Van Helmont propôs uma "receita" para criar ratos com camisas sujas e grãos de trigo. Hoje sabemos que isso é falso: foi a ideia da <strong>geração espontânea</strong>, derrubada por experimentos posteriores.
            </div>

            <h3>2. Sol e sombras (Módulo 3)</h3>
            <p>A iluminação do Sol muda ao longo do dia e do ano. Para estudar a posição do Sol, usamos um instrumento simples chamado <span class="hl">gnômon</span> (do grego, "o que indica") — basicamente uma haste fincada no chão, que projeta sombra.</p>
            <p>Observando a sombra ao longo do dia podemos identificar o <strong>"horizonte leste"</strong> (onde o Sol nasce) e o <strong>"horizonte oeste"</strong> (onde se põe).</p>
            <p>O experimento de <strong>Eratóstenes</strong> (séc. III a.C.) é um marco da ciência: usando um gnômon e a sombra do Sol em duas cidades distantes (Alexandria e Siena, no Egito), ele calculou a <strong>circunferência da Terra</strong> com impressionante precisão para a época. Esse mesmo experimento é refeito hoje por escolas do mundo inteiro.</p>

            <h3>3. Propriedades físicas da matéria (Módulo 5)</h3>
            <p>As <strong>propriedades físicas</strong> são características da matéria que podem ser observadas e medidas <em>sem mudar</em> a sua composição. Exemplos:</p>
            <ul>
              <li>massa, volume, cor, odor</li>
              <li>estado físico (sólido, líquido ou gasoso)</li>
              <li>temperatura de fusão e de ebulição</li>
              <li>densidade</li>
            </ul>

            <h4>Mudanças de estado físico</h4>
            <p>Aquecendo um material, ele tende a passar de sólido para gasoso. Resfriando, faz o caminho contrário.</p>
            <table>
              <thead><tr><th>De → Para</th><th>Nome</th><th>Exemplo</th></tr></thead>
              <tbody>
                <tr><td>Sólido → Líquido</td><td><span class="hl">Fusão</span></td><td>Gelo derretendo</td></tr>
                <tr><td>Líquido → Gasoso</td><td><span class="hl">Vaporização</span> (evaporação ou ebulição)</td><td>Água fervendo</td></tr>
                <tr><td>Gasoso → Líquido</td><td><span class="hl">Condensação</span></td><td>Vapor formando gotas no espelho</td></tr>
                <tr><td>Líquido → Sólido</td><td><span class="hl">Solidificação</span></td><td>Água virando gelo no congelador</td></tr>
                <tr><td>Sólido → Gasoso</td><td><span class="hl">Sublimação</span></td><td>Naftalina sumindo no armário</td></tr>
              </tbody>
            </table>
            <p>A <strong>vaporização</strong> tem dois "tipos":</p>
            <ul>
              <li><strong>Evaporação</strong>: lenta, na superfície do líquido, sem bolhas (água da lavagem que seca).</li>
              <li><strong>Ebulição</strong>: rápida, com bolhas, em qualquer ponto do líquido (água fervendo). Popularmente: "fervura".</li>
            </ul>

            <h4>Temperatura de fusão (TF) e temperatura de ebulição (TE)</h4>
            <p>São <strong>valores fixos</strong> para cada substância pura. Para a água, ao nível do mar:</p>
            <ul>
              <li><strong>TF</strong> = 0 °C (gelo vira água)</li>
              <li><strong>TE</strong> = 100 °C (água vira vapor)</li>
            </ul>
            <p>Esses valores ajudam a <em>diferenciar materiais</em> e a <em>prever o estado físico</em> de uma substância em determinada temperatura:</p>
            <ul>
              <li>Se a temperatura for <strong>menor</strong> que a TF → o material está <strong>sólido</strong>.</li>
              <li>Se estiver <strong>entre</strong> TF e TE → o material está <strong>líquido</strong>.</li>
              <li>Se for <strong>maior</strong> que a TE → o material está <strong>gasoso</strong>.</li>
            </ul>
            <p>Detalhe importante: <span class="hl">durante a mudança de estado, a temperatura permanece constante</span>. Por isso, mesmo fervendo a água, ela continua em 100 °C até virar tudo vapor.</p>

            <h4>Densidade</h4>
            <p>A <span class="hl">densidade</span> mostra quanta massa cabe em um determinado volume. A fórmula é:</p>
            <p style="text-align: center; font-size: 1.2rem;">
              densidade = massa ÷ volume (g/mL ou g/cm³)
            </p>
            <ul>
              <li>Água: 100 g em 100 mL → <strong>1,0 g/mL</strong>.</li>
              <li>Óleo de soja: 90 g em 100 mL → <strong>0,9 g/mL</strong>.</li>
              <li>Areia: <strong>1,8 g/mL</strong>, mais densa que a água.</li>
            </ul>
            <p>Quem é <strong>menos denso</strong> flutua. Quem é <strong>mais denso</strong> afunda. Por isso o óleo flutua na água, e a areia afunda.</p>

            <h3>4. Composição da matéria (Módulo 6)</h3>
            <p>Quando estudamos algo (um líquido, um gás, um pedaço de material), chamamos esse "pedaço" de <span class="hl">sistema</span>. Esse sistema pode ser:</p>
            <ul>
              <li><strong>Substância pura</strong>: formada por <em>uma única substância</em>. Tem propriedades constantes (ex.: água destilada — TE = 100 °C, sulfato de cobre — TF = 110 °C).</li>
              <li><strong>Mistura</strong>: formada por <em>duas ou mais substâncias</em>. As propriedades variam conforme a quantidade de cada componente.</li>
            </ul>

            <h4>Misturas comuns no dia a dia</h4>
            <table>
              <thead><tr><th>Mistura</th><th>Principais componentes</th></tr></thead>
              <tbody>
                <tr><td>Ar atmosférico</td><td>nitrogênio, oxigênio, argônio</td></tr>
                <tr><td>Água do mar</td><td>água + cloreto de sódio</td></tr>
                <tr><td>Vinagre</td><td>água + ácido acético</td></tr>
                <tr><td>Gás de botijão (GLP)</td><td>propano + butano</td></tr>
                <tr><td>Aço</td><td>ferro + carbono</td></tr>
                <tr><td>Leite</td><td>água, gorduras, proteínas e açúcares</td></tr>
                <tr><td>Ouro 18 quilates</td><td>ouro + prata</td></tr>
                <tr><td>Bronze</td><td>cobre + estanho</td></tr>
                <tr><td>Petróleo</td><td>hidrocarbonetos</td></tr>
              </tbody>
            </table>

            <h3>5. Separação de misturas (Módulo 7)</h3>
            <p>Muitas vezes, queremos pegar só um dos componentes de uma mistura. Por isso usamos métodos físicos de <strong>separação</strong>. Para escolher o melhor método, é preciso conhecer as <em>propriedades</em> de cada componente. Os métodos mudam conforme o tipo da mistura.</p>

            <h4>Misturas heterogêneas — sólido + sólido</h4>
            <ul>
              <li><span class="hl">Catação</span>: separar manualmente componentes de tamanhos/cores diferentes. Ex.: separar lixo reciclável; tirar pedrinhas do feijão.</li>
              <li><span class="hl">Tamisação (peneiração)</span>: usar uma peneira para separar sólidos de tamanhos diferentes. Ex.: separar a areia do cascalho na construção civil; peneirar a farinha.</li>
              <li><span class="hl">Levigação</span>: corrente de água separa por densidade. Ex.: garimpo do ouro — a areia é levada pela água e o ouro (mais denso) fica no fundo da bateia.</li>
              <li><span class="hl">Separação magnética</span>: ímã atrai materiais magnéticos (ferro, níquel, cobalto) e separa do resto. Ex.: tirar pedaços de ferro de um monte de areia; sucata em ferros-velhos.</li>
              <li><span class="hl">Dissolução fracionada</span>: aproveita que apenas um dos sólidos se dissolve no líquido. Ex.: para separar açúcar e areia, adiciona-se água — o açúcar dissolve, a areia não.</li>
            </ul>

            <h4>Misturas heterogêneas — sólido + líquido</h4>
            <ul>
              <li><span class="hl">Decantação</span>: deixar a mistura em repouso. O sólido mais denso vai para o fundo. Depois, transfere-se cuidadosamente o líquido para outro recipiente. Ex.: água + pó de mandioca para fazer a goma.</li>
              <li><span class="hl">Filtração</span>: passa-se a mistura por um filtro (papel, pano, coador). O sólido fica retido; o líquido passa. Ex.: <em>café coado</em>, água + grãos de feijão, aspirador de pó (que retém poeira do ar).</li>
            </ul>

            <h4>Misturas heterogêneas — líquido + líquido (imiscíveis)</h4>
            <ul>
              <li><span class="hl">Decantação com funil de bromo</span> (também chamado <em>funil de separação</em>): usado quando dois líquidos não se misturam, como <strong>água e óleo</strong>. Como a água é mais densa, fica embaixo. Abre-se a torneira do funil para deixar a água sair, fechando antes que o óleo escorra.</li>
            </ul>

            <h4>Misturas homogêneas — sólido dissolvido em líquido</h4>
            <ul>
              <li><span class="hl">Evaporação</span>: o líquido evapora (lentamente) e o sólido fica no recipiente. É o que ocorre nas <em>salinas</em>: a água do mar evapora pelo calor do Sol e o sal de cozinha fica para trás.</li>
              <li><span class="hl">Destilação simples</span>: aquece-se a mistura, o líquido vira vapor, passa por um <em>condensador</em> e volta a ser líquido em outro recipiente. O sólido fica no fundo. É como obtemos <em>água destilada</em> a partir da água do mar.</li>
            </ul>

            <h4>Misturas homogêneas — líquido + líquido (miscíveis)</h4>
            <ul>
              <li><span class="hl">Destilação fracionada</span>: parecida com a destilação simples, mas com uma <em>coluna de fracionamento</em> que separa líquidos com diferentes <strong>temperaturas de ebulição</strong>. Quem ferve primeiro sai primeiro. Esse é o processo usado nas refinarias para separar o <strong>petróleo</strong> em GLP (botijão), gasolina, querosene, óleo diesel e asfalto.</li>
            </ul>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              Para escolher o método certo, faça-se a pergunta: <em>os componentes são sólidos? Líquidos? Um se dissolve no outro? Têm densidades diferentes? Têm temperaturas de ebulição diferentes?</em> A resposta indica o método.
            </div>

            <div class="callout callout--attention">
              <strong>Atenção</strong>
              Não confunda <em>evaporação</em> com <em>ebulição</em>: a primeira é lenta e na superfície (sem bolhas); a segunda é rápida, com bolhas (fervura).
              Também tome cuidado com a diferença entre <em>substância pura</em> e <em>mistura</em>: tudo que você bebe, come ou respira no dia a dia geralmente é mistura.
            </div>
          `,

          resumo: `
            <h3>Método científico</h3>
            <ol>
              <li>Observação → 2. Hipótese → 3. Experimento → 4. Conclusão</li>
            </ol>
            <p><strong>Grupo experimental</strong>: recebe o fator estudado.<br>
               <strong>Grupo controle</strong>: não recebe (serve de comparação).</p>

            <h3>Mudanças de estado físico</h3>
            <table>
              <thead><tr><th>De → Para</th><th>Nome</th></tr></thead>
              <tbody>
                <tr><td>Sólido → Líquido</td><td><span class="hl--ok">Fusão</span> (aquecimento)</td></tr>
                <tr><td>Líquido → Gasoso</td><td><span class="hl--ok">Vaporização</span> (evaporação ou ebulição)</td></tr>
                <tr><td>Gasoso → Líquido</td><td><span class="hl--no">Condensação</span> (resfriamento)</td></tr>
                <tr><td>Líquido → Sólido</td><td><span class="hl--no">Solidificação</span> (resfriamento)</td></tr>
                <tr><td>Sólido → Gasoso ou Gasoso → Sólido</td><td><span class="hl">Sublimação</span></td></tr>
              </tbody>
            </table>

            <h3>Vaporização: dois jeitos</h3>
            <table>
              <thead><tr><th></th><th>Evaporação</th><th>Ebulição</th></tr></thead>
              <tbody>
                <tr><td>Velocidade</td><td>Lenta</td><td>Rápida</td></tr>
                <tr><td>Onde acontece</td><td>Só na superfície</td><td>Em todo o líquido</td></tr>
                <tr><td>Bolhas</td><td>Não</td><td>Sim (fervura)</td></tr>
                <tr><td>Exemplo</td><td>Roupa secando</td><td>Água fervendo</td></tr>
              </tbody>
            </table>

            <h3>Temperatura de fusão (TF) e ebulição (TE)</h3>
            <ul>
              <li>Água: <strong>TF = 0 °C</strong>, <strong>TE = 100 °C</strong> (ao nível do mar).</li>
              <li>Durante a mudança de estado, a temperatura <strong>permanece constante</strong>.</li>
              <li>Se T &lt; TF → sólido. Se TF &lt; T &lt; TE → líquido. Se T &gt; TE → gasoso.</li>
            </ul>

            <h3>Densidade</h3>
            <p><strong>densidade = massa ÷ volume</strong> (g/mL).</p>
            <ul>
              <li>Água ≈ <strong>1,0 g/mL</strong> · Óleo ≈ <strong>0,9 g/mL</strong> · Areia ≈ <strong>1,8 g/mL</strong>.</li>
              <li>Menos denso → <span class="hl--ok">flutua</span>. Mais denso → <span class="hl--no">afunda</span>.</li>
            </ul>

            <h3>Substância pura × mistura</h3>
            <table>
              <thead><tr><th></th><th>Substância pura</th><th>Mistura</th></tr></thead>
              <tbody>
                <tr><td>Componentes</td><td>Uma só substância</td><td>Duas ou mais</td></tr>
                <tr><td>Propriedades</td><td>Constantes</td><td>Variam</td></tr>
                <tr><td>Exemplos</td><td>Água destilada, sulfato de cobre</td><td>Água do mar, ar atmosférico, leite, aço, bronze</td></tr>
              </tbody>
            </table>

            <h3>Misturas comuns</h3>
            <table>
              <thead><tr><th>Mistura</th><th>Componentes</th></tr></thead>
              <tbody>
                <tr><td>Ar atmosférico</td><td>nitrogênio, oxigênio, argônio</td></tr>
                <tr><td>Água do mar</td><td>água + cloreto de sódio</td></tr>
                <tr><td>Vinagre</td><td>água + ácido acético</td></tr>
                <tr><td>GLP (botijão)</td><td>propano + butano</td></tr>
                <tr><td>Aço</td><td>ferro + carbono</td></tr>
                <tr><td>Bronze</td><td>cobre + estanho</td></tr>
              </tbody>
            </table>

            <h3>Métodos de separação</h3>
            <table>
              <thead><tr><th>Tipo de mistura</th><th>Método</th><th>Como funciona / exemplo</th></tr></thead>
              <tbody>
                <tr><td rowspan="5">Sólido + sólido (heterogênea)</td><td>Catação</td><td>À mão, por tamanho/cor (lixo reciclável)</td></tr>
                <tr><td>Tamisação (peneiração)</td><td>Peneira separa por tamanho (areia + cascalho)</td></tr>
                <tr><td>Levigação</td><td>Corrente de água separa por densidade (ouro)</td></tr>
                <tr><td>Separação magnética</td><td>Ímã atrai ferro, níquel, cobalto (sucata)</td></tr>
                <tr><td>Dissolução fracionada</td><td>Só um sólido se dissolve (areia + açúcar + água)</td></tr>
                <tr><td rowspan="2">Sólido + líquido (heterogênea)</td><td>Decantação</td><td>Sólido vai para o fundo (mandioca + água)</td></tr>
                <tr><td>Filtração</td><td>Filtro/coador retém o sólido (café, feijão)</td></tr>
                <tr><td>Líquido + líquido (heterogênea)</td><td>Decantação com funil de bromo</td><td>Líquidos imiscíveis com densidades diferentes (água + óleo)</td></tr>
                <tr><td rowspan="2">Sólido dissolvido em líquido (homogênea)</td><td>Evaporação</td><td>Líquido evapora, sólido fica (salinas)</td></tr>
                <tr><td>Destilação simples</td><td>Aquece, condensa e recolhe o líquido (água destilada)</td></tr>
                <tr><td>Líquido + líquido miscíveis (homogênea)</td><td>Destilação fracionada</td><td>Separa por temperatura de ebulição (refino do petróleo)</td></tr>
              </tbody>
            </table>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              Eratóstenes (séc. III a.C.) calculou a <strong>circunferência da Terra</strong> usando apenas um gnômon e a sombra do Sol em duas cidades — Alexandria e Siena.
            </div>
          `,

          dicas: `
            <ul>
              <li>Decore a ordem do método científico: <strong>observação → hipótese → experimento → conclusão</strong>.</li>
              <li>Em qualquer experimento, identifique qual é o <strong>grupo controle</strong> (sem o fator) e qual é o <strong>experimental</strong> (com o fator).</li>
              <li>Não confunda <em>evaporação</em> (lenta, sem bolhas) com <em>ebulição</em> (rápida, com bolhas).</li>
              <li>Lembre dos valores da água: <strong>0 °C</strong> congela, <strong>100 °C</strong> ferve (ao nível do mar).</li>
              <li>Durante uma mudança de estado, a temperatura <strong>não muda</strong>. Toda a energia recebida é usada na transformação.</li>
              <li>Para densidade, lembre: <strong>menos denso flutua, mais denso afunda</strong>. Por isso o óleo flutua na água.</li>
              <li>Substância pura tem propriedades fixas (ex.: água destilada ferve a 100 °C). Mistura varia (água do mar ferve um pouquinho acima).</li>
              <li>Em provas, é comum perguntar a <strong>composição</strong> de misturas como ar atmosférico (N₂, O₂, Ar), GLP (propano + butano), bronze (cobre + estanho).</li>
              <li>Antes de escolher um método de separação, identifique o tipo da mistura (sólido+sólido, sólido+líquido, líquido+líquido) e descubra qual <em>propriedade</em> diferencia os componentes (tamanho, densidade, magnetismo, solubilidade, temperatura de ebulição).</li>
              <li>Decore os exemplos clássicos: <em>café = filtração</em>; <em>água + óleo = decantação (funil de bromo)</em>; <em>sal das salinas = evaporação</em>; <em>petróleo = destilação fracionada</em>; <em>ouro do garimpo = levigação</em>; <em>sucata de ferro = separação magnética</em>.</li>
              <li>Use os termos científicos certos (<em>fusão, vaporização, condensação, decantação, destilação...</em>): em prova de Ciências, vocabulário conta muito.</li>
            </ul>
          `

            <h3>1. Sintagma nominal e suas classes (Módulo 8)</h3>
            <p>O <span class="hl">sintagma nominal</span> é um grupo de palavras cujo <strong>núcleo</strong> é um <em>substantivo</em>. Ao redor dele aparecem palavras que se ligam a ele, como <strong>artigos</strong> e <strong>adjetivos</strong>.</p>
            <p>Exemplos retirados do texto da apostila ("uma simples bonequina" e "o sábio quimico-cientista"):</p>
            <ul>
              <li><em>uma</em> (artigo) + <em>simples</em> (adjetivo) + <strong>bonequina</strong> (substantivo, núcleo)</li>
              <li><em>o</em> (artigo) + <em>sabugueiro</em> (substantivo) + <em>científico</em> (adjetivo)</li>
            </ul>

            <h3>2. Substantivo (classe e flexões)</h3>
            <p>Os <strong>substantivos</strong> nomeiam seres, objetos, lugares, ideias.</p>

            <h4>Flexão de número</h4>
            <ul>
              <li>Em geral, basta acrescentar <span class="hl">-s</span>: pessoa → pessoas, cachorro → cachorros, mão → mãos.</li>
              <li>Algumas palavras mudam mais que isso: <em>camponês → camponeses</em>, <em>gás → gases</em>, <em>papel → papéis</em>, <em>funil → funis</em>, <em>balcão → balcões</em>, <em>pão → pães</em>.</li>
              <li>Há substantivos sem marca de plural: <em>um lápis → dois lápis</em>, <em>o vírus → os vírus</em>, <em>ônibus lotado → dois ônibus lotados</em>. O número fica marcado pelo artigo ou outra palavra associada.</li>
            </ul>

            <h4>Flexão de gênero</h4>
            <ul>
              <li>Antes do masculino vem o artigo <strong>o</strong>; antes do feminino, o <strong>a</strong>: <em>o álbum / a pessoa, o nascimento / a morte, o papel / a tinta</em>.</li>
              <li>Mudanças simples (-o / -a): papagaio → papagaia; neto → neta; historiador → historiadora; irmão → irmã; visconde → viscondessa.</li>
              <li>Femininos diferentes: <em>ator → atriz</em>; <em>avô → avó</em>; <em>rei → rainha</em>; <em>galo → galinha</em>; <em>herói → heroína</em>; <em>bode → cabra</em>; <em>boi → vaca</em>.</li>
              <li>Mesma forma para os dois (muda só o artigo): <em>o/a estudante</em>, <em>o/a dentista</em>.</li>
              <li>Substantivos com forma única, valendo para ambos: <em>a criança</em>, <em>a criatura</em>, <em>a vítima</em>, <em>o indivíduo</em>, <em>a pessoa</em>.</li>
            </ul>

            <h3>3. Adjetivo e locução adjetiva</h3>
            <p>O <span class="hl">adjetivo</span> caracteriza o substantivo, indicando atributos (qualidades) ou propriedades.</p>
            <ul>
              <li><strong>Qualificadores</strong> (expressam opinião, juízo): <em>carro <u>confortável</u></em>, <em>comida <u>saborosa</u></em>, <em>moça <u>atenciosa</u></em>, <em>amigo <u>confiável</u></em>.</li>
              <li><strong>Classificadores</strong> (apenas classificam, sem opinião): <em>material <u>didático</u></em>, <em>água <u>fluvial</u></em>, <em>população <u>urbana</u></em>, <em>energia <u>solar</u></em>, <em>hino <u>nacional</u></em>.</li>
            </ul>
            <p>Os adjetivos também flexionam em <strong>gênero</strong> (caderno barato / caneta barata) e em <strong>número</strong> (livro fino / livros finos).</p>

            <h4>Locução adjetiva</h4>
            <p>É um <em>grupo de palavras</em> com a mesma função de um adjetivo. Em geral, "<em>de + substantivo</em>" pode virar um adjetivo:</p>
            <ul>
              <li>homem <strong>com músculos</strong> = homem <em>musculoso</em></li>
              <li>criaturas <strong>do mar</strong> = criaturas <em>marinhas</em></li>
              <li>análise <strong>de texto</strong> = análise <em>textual</em></li>
              <li>brincadeira <strong>de criança</strong> = brincadeira <em>infantil</em></li>
              <li>jovens <strong>sem juízo</strong> = jovens <em>desajuizados</em></li>
            </ul>
            <p>Algumas locuções não têm adjetivo correspondente: <em>toalha de banho</em>, <em>casebre sem teto</em>, <em>joia de ouro</em>, <em>computador com internet</em>.</p>

            <h3>4. Grau de substantivos e adjetivos</h3>
            <ul>
              <li><strong>Diminutivo</strong> (<em>-inho</em>, <em>-inha</em>): <em>bonequinha, finalzinho, testinha, casinha, latinzinho</em>.</li>
              <li><strong>Aumentativo</strong> (<em>-ão, -ona, -arra, -aço</em>): <em>bocarra, paizão, casebre, prédio enorme</em>.</li>
              <li><strong>Superlativo absoluto sintético</strong> (<em>-íssimo</em>): <em>exigentíssimas, carissimo, finíssimas</em>.</li>
              <li>Na fala do dia a dia, usamos elementos como <em>super-, hiper-, mega-</em>: <em>supergeladeira, hipercansada, megaevento</em>.</li>
            </ul>

            <h3>5. Artigos e suas contrações</h3>
            <ul>
              <li><span class="hl">Artigo definido</span> (<em>o, a, os, as</em>): refere-se a algo já mencionado ou conhecido. Ex.: <em>O caminhão</em> (que já citei) freou na curva.</li>
              <li><span class="hl">Artigo indefinido</span> (<em>um, uma, uns, umas</em>): refere-se a algo novo ou desconhecido. Ex.: <em>Um caminhão</em> apareceu na curva.</li>
            </ul>
            <p>O artigo se junta às preposições, formando <strong>contrações</strong>: <em>a + o = ao; de + o = do; em + a = na; por + o = pelo</em>...</p>

            <h3>6. Concordância nominal (Módulo 11)</h3>
            <p>É o ajuste de <strong>gênero</strong> e <strong>número</strong> entre o substantivo e seus determinantes (artigos, adjetivos, pronomes).</p>
            <p><strong>Exemplos:</strong></p>
            <ul>
              <li><em>As crianças <u>enjoadas</u></em> (feminino plural concorda com "crianças").</li>
              <li><em>Um <u>dia</u></em> (masculino singular).</li>
            </ul>
            <p>Na placa "<em>FIADO — somente para pessoas com mais de 90 anos acompanhado dos avós</em>", a concordância falha: como o substantivo é <strong>pessoas</strong> (feminino plural), o correto seria <strong>acompanhadas</strong>.</p>

            <h3>7. Concordância verbal</h3>
            <p>É o ajuste de <strong>pessoa</strong> (1ª, 2ª, 3ª) e <strong>número</strong> entre o verbo e o seu sujeito.</p>
            <ul>
              <li><strong>Sujeito simples</strong> (1 núcleo): <em>O trem chegou.</em> (3ª pessoa do singular)</li>
              <li><strong>Sujeito composto</strong> (mais de 1 núcleo): <em>As cigarras e os pássaros cantam.</em> (3ª pessoa do plural — junta tudo).</li>
              <li><em>O avô e a avó <strong>levaram</strong> as netas a Paraty.</em> (sujeito composto → verbo no plural).</li>
              <li>Vale também se o sujeito vier <em>depois</em>: <em>Chegou o trem.</em></li>
            </ul>

            <h3>8. Pontuação: vírgula, ponto-final, vocativo, reticências</h3>
            <ul>
              <li><strong>Ponto-final</strong>: marca o fim de uma frase.</li>
              <li><strong>Vírgula</strong>: indica uma pausa menor; pode mudar o sentido. Compare: <em>"andando de mão dada com o pai na praia, apontando umas cracas nas pedras"</em> (a vírgula liga o gerúndio ao "pai").</li>
              <li><strong>Vocativo</strong>: termo usado para chamar alguém. Vem isolado por vírgula: <em>Mãe, quero ir ao banheiro.</em> / <em>Quero ir, mãe, ao banheiro.</em></li>
              <li><strong>Reticências (...)</strong>: deixam o pensamento em aberto, podem indicar ironia, hesitação ou interrupção. <em>"Vejam só quem está falando..."</em></li>
            </ul>

            <h3>9. Antônimos com o prefixo in-/im-</h3>
            <p>Para formar o antônimo de várias palavras, basta acrescentar <span class="hl">in-</span> (ou <span class="hl">im-</span> antes de <strong>p</strong> ou <strong>b</strong>).</p>
            <ul>
              <li><em>feliz → infeliz</em>; <em>ativo → inativo</em>; <em>certeza → incerteza</em>; <em>devido → indevido</em>.</li>
              <li>Antes de <strong>p/b</strong> vira <strong>im-</strong>: <em>possibilidade → impossibilidade</em>; <em>parcial → imparcial</em>; <em>permeável → impermeável</em>; <em>piedade → impiedade</em>; <em>bebível → imbebível</em>.</li>
            </ul>
            <p>Foi assim que se formou <strong>inapetência</strong> (= ausência de apetência, de vontade de comer).</p>

            <h3>10. Norma-padrão e variantes linguísticas</h3>
            <p>A <strong>norma-padrão</strong> é o conjunto de regras de como a língua "deve ser usada" em situações formais (provas, redações, jornais). Mas a língua varia conforme a região, idade, contexto: existem <strong>variantes linguísticas</strong>.</p>
            <p>Música como o <em>"Cuitelinho"</em> usa uma variante regional (Pantanal). Não está "errada"; é apenas diferente da norma-padrão. Discriminar a fala dos outros é <strong>preconceito linguístico</strong>.</p>

            <h3>11. Coesão, coerência e pronomes (Módulo 17)</h3>
            <p><span class="hl">Coesão</span> é o modo como as palavras e frases se ligam no texto. <span class="hl">Coerência</span> é a articulação que dá sentido lógico ao texto.</p>
            <p>Um dos recursos mais comuns para garantir a coesão é o uso de <strong>pronomes</strong>, que retomam algo já dito sem precisar repetir o nome.</p>
            <p><strong>Exemplo:</strong> "<em>Diana, não entre nesta casa de novo. <u>Ela</u> está cheia de pulgas.</em>" → o pronome <em>Ela</em> retoma "<em>casa</em>".</p>

            <h4>Classificação dos pronomes</h4>
            <ul>
              <li><strong>Pessoais</strong>: indicam as pessoas do discurso. Retos: <em>eu, tu, ele(s), nós, vós, eles(as)</em>. Oblíquos: <em>me, te, o, a, lhe, se, nos, vos, lhes</em>.</li>
              <li><strong>Possessivos</strong>: indicam posse. <em>meu(s), minha(s), teu(s), tua(s), seu(s), sua(s), nosso(s), nossa(s), vosso(s), vossa(s)</em>.</li>
              <li><strong>Demonstrativos</strong>: indicam localização (no espaço/tempo) em relação ao falante. <em>este(s), esta(s), isto</em> (perto de quem fala); <em>esse(s), essa(s), isso</em> (perto de quem ouve); <em>aquele(s), aquela(s), aquilo</em> (longe dos dois).</li>
              <li><strong>Indefinidos</strong>: indicam coisas/pessoas de modo impreciso (<em>algum, todo, alguém, ninguém, nada</em>...).</li>
            </ul>

            <h4>Pronomes oblíquos com verbos</h4>
            <p>Quando o pronome <em>o, a, os, as</em> vem depois de um verbo terminado em <strong>r, s</strong> ou <strong>z</strong>, essas letras caem e o pronome vira <strong>-lo, -la, -los, -las</strong> (com acento se necessário):</p>
            <ul>
              <li><em>servir + a</em> → <strong>servi-la</strong></li>
              <li><em>notar + a</em> → <strong>notá-la</strong></li>
            </ul>
            <p>Quando o verbo termina em <strong>-m</strong>, os pronomes <em>o, a, os, as</em> viram <strong>-no, -na, -nos, -nas</strong>: <em>pintavam + as</em> → <strong>pintavam-nas</strong>.</p>

            <div class="callout callout--attention">
              <strong>Atenção</strong>
              Em concordância nominal, o adjetivo concorda com o substantivo (gênero e número). Em concordância verbal, o verbo concorda com o sujeito (pessoa e número). Sujeito composto pede, em geral, verbo no <strong>plural</strong>.
            </div>

          resumo: `
            <h3>Sintagma nominal</h3>
            <p>Substantivo (núcleo) + artigo + adjetivo. Ex.: <em>"uma simples bonequina"</em>.</p>

            <h3>Substantivo — flexões</h3>
            <table>
              <thead><tr><th>Tipo</th><th>Exemplos</th></tr></thead>
              <tbody>
                <tr><td>Plural com -s</td><td>pessoa/pessoas, mão/mãos</td></tr>
                <tr><td>Plural irregular</td><td>pão → pães; gás → gases; balcão → balcões; papel → papéis</td></tr>
                <tr><td>Singular = plural</td><td>o lápis / os lápis · o vírus / os vírus</td></tr>
                <tr><td>Feminino diferente</td><td>ator → atriz · avô → avó · rei → rainha · galo → galinha · herói → heroína · bode → cabra</td></tr>
                <tr><td>Mesma forma</td><td>o/a estudante · o/a dentista</td></tr>
              </tbody>
            </table>

            <h3>Adjetivo — qualificador × classificador</h3>
            <table>
              <thead><tr><th>Tipo</th><th>O que faz</th><th>Exemplos</th></tr></thead>
              <tbody>
                <tr><td>Qualificador</td><td>expressa <em>opinião</em></td><td>carro confortável, moça atenciosa</td></tr>
                <tr><td>Classificador</td><td>apenas <em>classifica</em></td><td>material didático, energia solar, hino nacional</td></tr>
              </tbody>
            </table>

            <h3>Locução adjetiva</h3>
            <table>
              <thead><tr><th>Locução adjetiva</th><th>Adjetivo correspondente</th></tr></thead>
              <tbody>
                <tr><td>do mar</td><td>marinho/marinha</td></tr>
                <tr><td>de criança</td><td>infantil</td></tr>
                <tr><td>com músculos</td><td>musculoso</td></tr>
                <tr><td>de texto</td><td>textual</td></tr>
                <tr><td>sem juízo</td><td>desajuizado</td></tr>
              </tbody>
            </table>

            <h3>Grau</h3>
            <ul>
              <li><strong>Diminutivo</strong>: <em>-inho/-inha</em> (bonequinha, latinzinho).</li>
              <li><strong>Aumentativo</strong>: <em>-ão/-ona/-arra/-aço</em> (bocarra, paizão, prédio enorme).</li>
              <li><strong>Superlativo absoluto</strong>: <em>-íssimo</em> (exigentíssimas, carissimo).</li>
              <li>Coloquial: <em>super-, hiper-, mega-</em> (supergeladeira, megaevento).</li>
            </ul>

            <h3>Artigo: definido × indefinido</h3>
            <table>
              <thead><tr><th></th><th>Definido</th><th>Indefinido</th></tr></thead>
              <tbody>
                <tr><td>Singular</td><td>o, a</td><td>um, uma</td></tr>
                <tr><td>Plural</td><td>os, as</td><td>uns, umas</td></tr>
                <tr><td>Quando usar</td><td>algo já mencionado/conhecido</td><td>algo novo/desconhecido</td></tr>
              </tbody>
            </table>

            <h3>Concordância nominal × verbal</h3>
            <table>
              <thead><tr><th></th><th>Concordância nominal</th><th>Concordância verbal</th></tr></thead>
              <tbody>
                <tr><td>Quem combina</td><td>artigos + adjetivos com o substantivo</td><td>verbo com o sujeito</td></tr>
                <tr><td>Em quê</td><td>gênero e número</td><td>pessoa e número</td></tr>
                <tr><td>Exemplo</td><td>as crianças enjoadas</td><td>o trem chegou; as cigarras cantam</td></tr>
              </tbody>
            </table>

            <p><strong>Sujeito composto</strong> (mais de um núcleo) → verbo no <strong>plural</strong>: <em>O avô e a avó levaram as netas a Paraty.</em></p>

            <h3>Antônimos com in-/im-</h3>
            <ul>
              <li>Em geral: <span class="hl">in-</span> + palavra (<em>infeliz, inativo, incerteza, indevido</em>).</li>
              <li>Antes de <strong>p</strong> ou <strong>b</strong>: <span class="hl">im-</span> (<em>impossibilidade, imparcial, impermeável, impiedade, imbebível</em>).</li>
            </ul>

            <h3>Pontuação principal</h3>
            <ul>
              <li><strong>Ponto-final</strong>: encerra a frase.</li>
              <li><strong>Vírgula</strong>: pequena pausa; pode mudar o sentido.</li>
              <li><strong>Vírgula no vocativo</strong> (chamar alguém): <em>Mãe, quero ir ao banheiro.</em></li>
              <li><strong>Reticências (...)</strong>: deixam algo em aberto (ironia, hesitação, interrupção).</li>
            </ul>

            <h3>Pronomes — quadro rápido</h3>
            <table>
              <thead><tr><th>Tipo</th><th>Exemplos</th></tr></thead>
              <tbody>
                <tr><td>Pessoais retos</td><td>eu, tu, ele/ela, nós, vós, eles/elas</td></tr>

              <li>Para identificar o <strong>núcleo</strong> de um sintagma nominal, procure o substantivo (a palavra que dá nome ao ser).</li>

              <li>Se o substantivo não tem plural diferente (lápis, vírus, ônibus), quem indica o número é o artigo: <em>um lápis × dois lápis</em>.</li>

              <li>Para reconhecer locução adjetiva, troque por um adjetivo: <em>do mar = marinhas</em>, <em>de criança = infantil</em>.</li>

              <li>Em <strong>concordância verbal</strong>, encontre o sujeito e ajuste o verbo. Sujeito composto (com "e") → verbo no plural.</li>

            </ul>
