            <h3>1. Saludos y presentaciones (Módulo 1)</h3>
            <p>Saudar é uma forma de cortesia presente em todas as culturas. Em espanhol, alguns saudações comuns são:</p>
            <ul>
              <li><strong>Hola</strong> — oi.</li>
              <li><strong>¡Hola, ¿qué tal?</strong> — oi, tudo bem? (informal)</li>
              <li><strong>Buenos días</strong> — bom dia.</li>
              <li><strong>Buenas tardes</strong> — boa tarde.</li>
              <li><strong>Buenas noches</strong> — boa noite.</li>
              <li><strong>Mucho gusto</strong> / <strong>encantado(a)</strong> — muito prazer.</li>
              <li><strong>Hasta luego</strong> / <strong>hasta mañana</strong> — até logo / até amanhã.</li>
              <li><strong>Adiós</strong> — adeus.</li>
            </ul>
            <p>Para se apresentar, é comum dizer:</p>
            <ul>
              <li><em>Hola, me llamo Pedro.</em> (Oi, eu me chamo Pedro.)</li>
              <li><em>Soy de Brasil.</em> (Sou do Brasil.)</li>
              <li><em>Tengo once años.</em> (Tenho onze anos.)</li>
              <li><em>Estudio en una escuela pública.</em> (Estudo em uma escola pública.)</li>
            </ul>
            <p>Existem perguntas básicas para conhecer alguém: <em>¿Cómo te llamas? ¿Cuáles son tus apellidos? ¿Cuántos años tienes? ¿De dónde eres? ¿Dónde vives? ¿Cuál es tu nacionalidad? ¿Tienes apodo?</em></p>

            <div class="callout callout--attention">
              <strong>¡Ojo!</strong>
              No espanhol, as perguntas começam com <span class="hl">¿</span> (sinal de interrogação invertido) e terminam com <span class="hl">?</span>. O mesmo vale para as exclamações: <span class="hl">¡</span> ... <span class="hl">!</span>.
            </div>

            <h3>2. Pronombres interrogativos</h3>
            <p>São usados para fazer perguntas. Em espanhol, eles <strong>sempre levam acento gráfico (tilde)</strong>, mesmo em perguntas indiretas.</p>
            <ul>
              <li><strong>¿Qué?</strong> — pergunta por objetos, ideias ou ações. <em>¿Qué estudias?</em></li>
              <li><strong>¿Cuál? / ¿Cuáles?</strong> — pergunta para identificar algo entre várias possibilidades. <em>¿Cuál es tu dirección?</em></li>
              <li><strong>¿Quién? / ¿Quiénes?</strong> — pergunta por pessoas. <em>¿Quiénes son tus padres?</em></li>
              <li><strong>¿Dónde?</strong> — pergunta por lugar. <em>¿Dónde vives?</em></li>
              <li><strong>¿Cómo?</strong> — pergunta por modo, estado ou características. <em>¿Cómo te llamas?</em></li>
              <li><strong>¿Cuándo?</strong> — pergunta pelo momento (tempo). <em>¿Cuándo vienes a Madrid?</em></li>
              <li><strong>¿Cuánto? / ¿Cuánta? / ¿Cuántos? / ¿Cuántas?</strong> — pergunta por quantidade. <em>¿Cuántos años tienes?</em></li>
            </ul>
            <p>Em pergunta direta: <em>¿Cuál es tu apellido?</em> — em pergunta indireta: <em>Ella siempre me pregunta cuál es mi apellido.</em> (a tilde continua!)</p>

            <h3>3. Formas de tratamiento</h3>
            <p>Em espanhol, escolhemos a forma de tratamento de acordo com o grau de proximidade com a outra pessoa (confiança × distância/respeito).</p>
            <table>
              <thead><tr><th>Forma</th><th>Quando se usa</th><th>Onde</th></tr></thead>
              <tbody>
                <tr><td><strong>Tú</strong></td><td>Confiança (informal)</td><td>Espanha e quase toda a Hispanoamérica</td></tr>
                <tr><td><strong>Vos</strong></td><td>Confiança (informal)</td><td>Alguns países (como Argentina, Uruguai, regiões do Paraguai, Colômbia, América Central)</td></tr>
                <tr><td><strong>Usted</strong></td><td>Distância e respeito (formal)</td><td>Toda Espanha e Hispanoamérica</td></tr>
                <tr><td><strong>Vosotros / Vosotras</strong></td><td>Plural de <em>tú</em>, confiança</td><td>Espanha</td></tr>
                <tr><td><strong>Ustedes</strong></td><td>Plural — confiança E distância</td><td>Toda Hispanoamérica (e em Espanha como plural formal)</td></tr>
              </tbody>
            </table>
            <p>No português do Brasil, usamos <em>você</em> (mais geral) e <em>tu</em> (em algumas regiões).</p>

            <div class="callout callout--attention">
              <strong>¡Ojo!</strong>
              O pronome <strong>usted</strong> é uma forma de 2ª pessoa (você se dirige a alguém), mas o verbo vai conjugado na <strong>3ª pessoa do singular</strong>: <em>¿Usted habla francés?</em> (e não "habla<strong>s</strong>").
            </div>

            <h3>4. El alfabeto</h3>
            <p>O alfabeto espanhol tem <strong>27 letras</strong>. A grande diferença em relação ao português é a letra <strong>ñ</strong> (eñe), que não existe em português nem em inglês.</p>
            <p>As combinações <em>ch</em> e <em>ll</em> antes eram consideradas letras à parte; hoje são tratadas como dígrafos (e não letras).</p>
            <p>Em espanhol, o verbo <strong>deletrear</strong> significa "soletrar" — pronunciar separadamente o nome de cada letra de uma palavra. Exemplo: <em>¿Puedes deletrear tu apellido?</em></p>

            <h3>5. Las nacionalidades</h3>
            <p>Para dizer de onde uma pessoa é, usamos um <em>adjetivo de nacionalidade</em>, que muda no <strong>gênero</strong> (masculino/feminino) e no <strong>número</strong> (singular/plural).</p>

                <tr><td>Nicaragua</td><td>nicaragüense</td><td>nicaragüense</td></tr>
              </tbody>
            </table>

            <h3>6. Los pronombres personales sujeto (Módulo 2)</h3>
            <p>Os pronomes pessoais sujeito indicam <em>quem</em> realiza a ação do verbo.</p>
            <table>
              <thead><tr><th>Pessoa</th><th>Singular</th><th>Plural</th></tr></thead>
              <tbody>
                <tr><td>1ª</td><td><strong>Yo</strong></td><td><strong>Nosotros / Nosotras</strong></td></tr>
                <tr><td>2ª</td><td><strong>Tú / Vos / Usted</strong></td><td><strong>Vosotros / Vosotras / Ustedes</strong></td></tr>
                <tr><td>3ª</td><td><strong>Él / Ella</strong></td><td><strong>Ellos / Ellas</strong></td></tr>
              </tbody>
            </table>

            <div class="callout callout--attention">
              <strong>¡Ojo!</strong>
              Em espanhol, <em>nem sempre</em> é necessário usar o pronome pessoal sujeito, pois o próprio verbo já indica quem fala. Use o pronome só quando precisar destacar ou diferenciar pessoas.
              <br>Ex.: <em>Soy de Venezuela.</em> (sem pronome) — <em>Yo soy de Perú; y ella, de Guatemala.</em> (com pronome para contrastar).
            </div>

            <h3>7. El presente de indicativo (verbos ser, estar, vivir, llamarse, estudiar)</h3>
            <p>Esses são alguns dos verbos mais usados na hora de se apresentar.</p>

            <h4>Conjugação no presente</h4>
            <table>
              <thead><tr><th>Pessoa</th><th>Ser</th><th>Estar</th><th>Vivir</th><th>Llamarse</th><th>Estudiar</th></tr></thead>
              <tbody>
                <tr><td>Yo</td><td>soy</td><td>estoy</td><td>vivo</td><td>me llamo</td><td>estudio</td></tr>
                <tr><td>Tú / Vos</td><td>eres / sos</td><td>estás</td><td>vives / vivís</td><td>te llamas / te llamás</td><td>estudias / estudiás</td></tr>

                <tr><td>Vosotros / Vosotras</td><td>sois</td><td>estáis</td><td>vivís</td><td>os llamáis</td><td>estudiáis</td></tr>

            <h4>Quando usar SER × ESTAR</h4>
            <ul>
              <li><strong>Ser</strong>: para nacionalidade, profissão, características permanentes. <em>Yo soy brasileño. Ella es estudiante.</em></li>

            <h4>Llamarse — verbo "pronominal"</h4>
            <p><em>Llamarse</em> é um verbo "reflexivo" (acompanhado de um pronome): <strong>me llamo, te llamas, se llama, nos llamamos, os llamáis, se llaman</strong>.</p>
            <p>Ex.: <em>Yo me llamo Pedro.</em> (Eu me chamo Pedro.) — <em>¿Cómo te llamas?</em> (Como você se chama?)</p>

            <table>
              <thead><tr><th>Pronombre</th><th>Para que serve</th><th>Exemplo</th></tr></thead>

                <tr><td>¿Cuánto?(s) / ¿Cuánta?(s)</td><td>quantidade</td><td>¿Cuántos años tienes?</td></tr>
              </tbody>
            </table>

            <p><strong>Atenção:</strong> os interrogativos <em>sempre</em> levam tilde (acento), mesmo em perguntas indiretas.</p>

            <h3>Formas de tratamento</h3>
            <table>

            <p><strong>Importante:</strong> <em>usted</em> usa o verbo na <strong>3ª pessoa do singular</strong>.</p>

            <h3>El alfabeto</h3>

            <h3>Pronombres personales sujeto</h3>

              <thead><tr><th>Pessoa</th><th>Singular</th><th>Plural</th></tr></thead>

            <ul>
              <li>Em espanhol, as perguntas e exclamações têm sinais nos <strong>dois lados</strong> da frase: <em>¿...?</em> e <em>¡...!</em>.</li>
              <li>Os <strong>pronombres interrogativos</strong> sempre levam tilde (acento), mesmo em perguntas indiretas: <em>¿Cómo? ¿Dónde? ¿Cuándo? ¿Cuánto?</em>.</li>
              <li>Não confunda <strong>¿Qué?</strong> (objetos, ações) com <strong>¿Cuál?</strong> (escolher entre opções) e <strong>¿Quién?</strong> (pessoas).</li>
              <li>O pronome <strong>usted</strong> indica respeito (formal), mas o verbo vai na <strong>3ª pessoa do singular</strong>: <em>Usted es, Usted vive, Usted se llama</em>.</li>
              <li>Em Espanha, o plural de <em>tú</em> é <strong>vosotros</strong>; em Hispanoamérica, é <strong>ustedes</strong>.</li>
              <li>A letra <strong>ñ</strong> não existe em português. Cuidado para não confundir com <em>n</em>.</li>
              <li>Use <strong>ser</strong> para algo permanente (nacionalidade, características) e <strong>estar</strong> para estado, localização ou situação temporária.</li>
              <li>O verbo <strong>llamarse</strong> sempre vem com pronome (me, te, se, nos, os, se): <em>Me llamo Pedro.</em> Não esqueça o pronome.</li>
              <li>Em espanhol, <strong>nem sempre</strong> é necessário usar o pronome pessoal sujeito (<em>Soy de Brasil</em>). Use só para destacar ou comparar pessoas.</li>
              <li>Para dizer a nacionalidade, ajuste o adjetivo no <strong>gênero</strong> (masculino/feminino) e <strong>número</strong>: <em>Ella es brasileña; ellos son mexicanos.</em></li>
              <li>Cuidado com falsos cognatos! <em>Apellido</em> = sobrenome; <em>cuello</em> = pescoço; <em>oficina</em> = escritório; <em>vaso</em> = copo.</li>
            </ul>
          `

            <h3>1. Tempo cronológico × tempo histórico (Módulo 4)</h3>
            <p>O <span class="hl">tempo cronológico</span> é o tempo registrado nos calendários (a sucessão de datas: dias, semanas, meses, anos, décadas, séculos, milênios). Já o <span class="hl">tempo histórico</span> é o modo como cada grupo organiza e percebe esse tempo a partir das suas experiências, modos de vida e cultura.</p>
            <p>Por isso, sociedades diferentes podem viver no <strong>mesmo tempo cronológico</strong> e em <strong>tempos históricos diferentes</strong>. Por exemplo: a sociedade brasileira atual e os povos Yanomami vivem no mesmo ano de 2026, mas têm modos muito diferentes de organizar a vida.</p>

            <h3>2. Diferentes calendários e seus marcos</h3>
            <p>Cada povo escolheu um marco diferente para começar a contar o tempo:</p>
            <ul>
              <li><strong>Calendário ocidental (cristão ou gregoriano)</strong>: a passagem do ano é em 1º de janeiro e o marco é o <em>nascimento de Cristo</em>. Foi instituído pelo Papa Gregório XIII em 1582.</li>
              <li><strong>Calendário islâmico (muçulmano)</strong>: a passagem do ano é em 1º de muharram e o marco é a <em>Hégira</em>, a partida do profeta Maomé da cidade de Meca para a cidade de Medina.</li>
              <li><strong>Calendário judaico</strong>: o marco é a <em>criação do mundo</em>, segundo a tradição religiosa. O ano 1 é também associado à saída de Abraão e sua tribo de Ur, na Caldeia.</li>
              <li><strong>Calendário chinês</strong>: contado a partir do nascimento de Buda; cada ano é representado por um animal (Rato, Boi, Tigre, Coelho, Dragão, Serpente, Cavalo, Cabra, Macaco, Galo, Cão e Porco).</li>
            </ul>
            <p>Em 2022, esses calendários marcavam: ocidental = 2022, islâmico = 1444, judaico = 5783 e chinês = 4720. Os números são diferentes porque os <em>marcos iniciais</em> são diferentes.</p>

            <h3>3. Como os historiadores dividem o tempo</h3>
            <p>Para facilitar os estudos, os historiadores agrupam os fatos em grandes períodos. Uma das divisões mais usadas é a <span class="hl">história ocidental</span>:</p>
            <ul>
              <li><strong>Pré-História</strong> — antes do surgimento da escrita (cerca de 4000 a.C.).</li>
              <li><strong>Antiguidade</strong> — de cerca de 4000 a.C. até <strong>476</strong> (queda do Império Romano do Ocidente).</li>
              <li><strong>Idade Média</strong> — de 476 até <strong>1453</strong> (queda do Império Romano do Oriente, com a tomada de Constantinopla).</li>
              <li><strong>Idade Moderna</strong> — de 1453 até <strong>1789</strong> (Revolução Francesa).</li>
              <li><strong>Idade Contemporânea</strong> — de 1789 até hoje.</li>
            </ul>
            <p>A história do <strong>Brasil</strong> também tem uma divisão própria:</p>
            <ul>
              <li><strong>Pré-Colonial</strong> (antes de 1500): povos indígenas.</li>
              <li><strong>Colonial</strong> (1500–1822): chegada dos portugueses; em 1530 começou a colonização.</li>
              <li><strong>Imperial</strong> (1822–1889): a partir da Independência do Brasil.</li>
              <li><strong>Republicano</strong> (1889 até hoje): a partir da Proclamação da República.</li>
            </ul>

            <h3>4. Etnocentrismo</h3>
            <p><span class="hl">Etnocentrismo</span> é a tendência de valorizar a própria cultura (o próprio modo de vida, língua, religião, costumes) e julgar as outras como "inferiores" ou "atrasadas".</p>
            <p>É uma postura de <em>preconceito</em>: quando um povo se julga melhor que os outros, abre espaço para a violência, a intolerância e o desrespeito. O ideal é conhecer e respeitar as outras culturas — todos os povos têm valores e práticas válidas para si.</p>

            <h3>5. A origem dos humanos (Módulo 5)</h3>
            <p>A ciência e a religião explicam a origem dos seres humanos de formas diferentes:</p>
            <ul>
              <li>O <strong>criacionismo</strong> baseia-se em explicações religiosas (a Bíblia, por exemplo).</li>
              <li>A <strong>ciência</strong> trabalha com hipóteses, métodos rigorosos e investigações arqueológicas. A hipótese mais aceita é que a espécie humana surgiu no <em>continente africano há cerca de 6 milhões de anos</em>.</li>
            </ul>
            <p>O escritor israelense <em>Yuval Noah Harari</em>, em <em>Sapiens — Uma breve história da humanidade</em>, destaca a <strong>Revolução Cognitiva</strong>: a capacidade do <em>Homo sapiens</em> de criar e transmitir ideias sobre coisas que não existem (mitos, deuses, religiões), permitindo a cooperação em grandes números.</p>

            <h3>6. O processo de hominização</h3>
            <p><span class="hl">Hominização</span> é o longo processo de transformação que originou os seres humanos atuais. Algumas características importantes:</p>
            <ul>
              <li><strong>Bipedismo</strong>: andar sobre os dois pés. Permitiu deslocamentos mais longos e rápidos e <em>liberou as mãos</em> para outras funções.</li>
              <li><strong>Polegar opositor</strong>: o polegar pode tocar os outros dedos, dando capacidade de segurar, transportar e fabricar objetos.</li>
              <li><strong>Aumento da caixa craniana e do cérebro</strong>: capacidade de planejar, observar e criar ferramentas.</li>
              <li><strong>Aparelho fonador</strong>: o conjunto de órgãos que produz sons da fala. Seu aperfeiçoamento foi essencial para o desenvolvimento da <em>linguagem</em>.</li>
            </ul>
            <p>Algumas espécies importantes desse processo: <em>Homo erectus</em> (homem ereto) e <em>Homo sapiens</em> (homem sábio — nós).</p>

            <h3>7. A descoberta do fogo</h3>
            <p>Há entre 1,8 milhão e 300 mil anos, alguns grupos humanos descobriram a técnica de <em>produzir fogo</em> (atrito entre pedras ou pedaços de madeira).</p>
            <p>O fogo mudou a vida desses grupos:</p>
            <ul>
              <li>Iluminava a noite.</li>
              <li>Protegia do frio e dos animais ferozes.</li>
              <li>Permitia <strong>cozinhar</strong> alimentos, tornando-os mais fáceis de mastigar e digerir, e ampliando a dieta (alimentos antes infestados ou parasitados ficaram seguros).</li>
            </ul>

            <h3>8. Plantar para poder ficar — agricultura e sedentarismo</h3>
            <p>Os primeiros humanos eram <strong>nômades</strong>: se mudavam constantemente para caçar e coletar alimentos.</p>
            <p>Há aproximadamente <strong>11 mil anos</strong>, alguns grupos do Oriente Médio desenvolveram técnicas de cultivo de plantas e domesticação de animais — a <strong>agricultura</strong>. Como precisavam ficar perto da plantação, esses grupos passaram a ter <span class="hl">vida sedentária</span> (fixavam-se em uma região).</p>
            <p>Junto com a agricultura, surgiram a cerâmica (vasos para guardar grãos), a tecelagem, ferramentas de pedra polida e a divisão do trabalho.</p>

            <h3>9. A divisão da Pré-História: Paleolítico × Neolítico</h3>
            <ul>
              <li><strong>Paleolítico</strong> (do grego "pedra antiga" / pedra lascada): caça, coleta e nomadismo. Ferramentas feitas de pedra lascada, bem cortantes.</li>
              <li><strong>Neolítico</strong> (do grego "pedra nova" / pedra polida): agricultura, criação de animais e vida sedentária. Ferramentas de pedra polida, mais resistentes.</li>
              <li>Depois vem a <strong>Idade dos Metais</strong>, marcada pela técnica da fundição.</li>
            </ul>

            <h3>10. Crenças religiosas (Módulo 6)</h3>
            <p>Em todos os povos surgiram formas de religiosidade. Os humanos sempre buscaram explicações para o universo e para si mesmos. Há dois grandes tipos de religião:</p>
            <ul>
              <li><span class="hl">Politeísmo</span> (do grego <em>poli</em> = vários, <em>teísta</em> = referente a Deus): crença em <strong>vários deuses</strong>. Surge das primeiras formas de religiosidade — o culto às forças da natureza (Sol, Lua, água, fogo, vento). Exemplos antigos: gregos, egípcios, romanos. Hoje: candomblé, xintoísmo.</li>
              <li><span class="hl">Monoteísmo</span> (<em>mono</em> = um, <em>teísta</em> = referente a Deus): crença em um <strong>único Deus</strong>. Os primeiros povos monoteístas foram os <em>hebreus</em>, na região do Oriente próximo (perto do mar Mediterrâneo). Acreditavam num único Deus (Javé). Os textos sagrados foram organizados na Bíblia (Velho Testamento). Mais tarde surgiram o <strong>Cristianismo</strong> (Jesus Cristo, há cerca de 2 mil anos) e o <strong>Islamismo</strong> (Maomé, no século VII).</li>
            </ul>
            <p>Além disso, é importante combater o <strong>fundamentalismo</strong>, que é a ideia de que apenas uma religião ou modo de pensar é o verdadeiro, e cultivar o respeito, o diálogo e a coexistência pacífica.</p>

            <h3>11. As cidades: outra forma de viver</h3>
            <p>Com a agricultura e o sedentarismo, surgiram as primeiras cidades. As pessoas se agruparam em comunidades cada vez maiores, e isso aconteceu sempre <strong>perto dos rios</strong> (Tigre, Eufrates e Nilo, por exemplo) — porque a agricultura precisava de água o ano todo.</p>
            <p>Exemplos importantes:</p>
            <ul>
              <li><strong>Çatal Hüyük</strong>, na atual Turquia: surgida há mais de 8 mil anos, com cerca de 7 mil habitantes.</li>
              <li><strong>Uruk</strong>, na Mesopotâmia (atual Iraque): chegou a 50 mil habitantes há cerca de 5 mil anos.</li>
            </ul>

            <h3>12. Novas formas de poder e o surgimento da escrita</h3>
            <p>Com cidades grandes, surgiram diferenças sociais e a <strong>especialização do trabalho</strong> (uns plantavam, outros eram artesãos, sacerdotes, comerciantes...). Apareceram líderes que precisavam:</p>
            <ul>
              <li><strong>Força</strong>: exércitos, para defender e impor a obediência.</li>
              <li><strong>Convencimento</strong>: muitos governantes diziam ser "escolhidos pelos deuses". Sacerdotes e líderes religiosos ajudavam nesse convencimento.</li>
            </ul>
            <p>Para cobrar tributos e controlar as cidades, surgiu uma nova função especializada: o <em>escriba</em>. Foi a necessidade de registrar tributos e regras que levou ao <span class="hl">surgimento da escrita</span>. Quando as regras (códigos) começaram a ser registradas por escrito, deixaram de ser transmitidas apenas oralmente.</p>

            <div class="callout callout--remember">
              <strong>Lembre-se</strong>
              A passagem do nomadismo para o sedentarismo (com a agricultura) muda quase tudo: surgem cidades, divisão do trabalho, líderes, exércitos, religião organizada e, por fim, a escrita.
            </div>

    /* Estado em memória para acompanhar o progresso por disciplina. */
    const progressState = {};

    /* =========================================================
       2. RENDERIZAÇÃO DE ABAS E PAINÉIS
       ====================================================a===== */
    function renderTabs() {
      const nav = document.getElementById("nav-tabs");
      const content = document.getElementById("content");
      nav.innerHTML = "";
      content.innerHTML = "";

      Object.entries(subjects).forEach(([key, subject], index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.target = key;
        btn.innerHTML = `<span class="tab-icon">${subject.icon}</span>${subject.title}`;
        btn.addEventListener("click", () => activateSubject(key));
        nav.appendChild(btn);

        const panel = document.createElement("section");
        panel.className = "subject-panel";
        panel.id = `panel-${key}`;
        panel.innerHTML = renderSubjectPanel(key, subject);
        content.appendChild(panel);

        progressState[key] = { answered: new Set(), correct: new Set() };

        if (index === 0) activateSubject(key);
      });

      // Aba especial do simulado, ao lado das disciplinas.
      const simBtn = document.createElement("button");
      simBtn.type = "button";
      simBtn.dataset.target = "simulado";
      simBtn.classList.add("tab--simulado");
      simBtn.innerHTML = `<span class="tab-icon">${simulado.icon}</span>${simulado.title}`;
      simBtn.addEventListener("click", () => activateSubject("simulado"));
      nav.appendChild(simBtn);

      const simPanel = document.createElement("section");
      simPanel.className = "subject-panel";
      simPanel.id = "panel-simulado";
      simPanel.innerHTML = renderSimuladoPanel(simulado);
      content.appendChild(simPanel);

      bindAccordions();
      bindContentSwitch();
      bindExerciseEvents();
      bindSimuladoEvents();
    }

    function activateSubject(key) {
      document.querySelectorAll(".nav-tabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.target === key);
      });
      document.querySelectorAll(".subject-panel").forEach(p => {
        p.classList.toggle("active", p.id === `panel-${key}`);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================================
       3. RENDERIZAÇÃO DE PAINEL DE DISCIPLINA
       ========================================================= */
    function renderSubjectPanel(key, subject) {
      const exercisesHtml = subject.exercises
        .map((ex, i) => renderExercise(key, ex, i))
        .join("");

      const sectionsHtml = SECTION_TEMPLATE.map(sec => {
        let body;
        if (sec.key === "exercicios") {
          body = exercisesHtml || `<p>Nenhum exercício cadastrado ainda.</p>`;
        } else if (sec.key === "conteudo") {
          const resumoHtml = subject.sections.resumo || `<p>Resumo em preparação.</p>`;
          const explicacaoHtml = subject.sections.explicacao || `<p>Conteúdo em preparação.</p>`;
          body = `
            <div class="content-switch" role="tablist" aria-label="Modo de visualização do conteúdo">
              <button type="button" class="content-switch__btn active"
                      role="tab" aria-selected="true" data-view="resumo">Resumo</button>
              <button type="button" class="content-switch__btn"
                      role="tab" aria-selected="false" data-view="explicacao">Conteúdo geral</button>
            </div>
            <div class="content-view active" data-view="resumo">${resumoHtml}</div>
            <div class="content-view" data-view="explicacao">${explicacaoHtml}</div>
          `;
        } else {
          body = subject.sections[sec.key] || `<p>Conteúdo em preparação.</p>`;
        }

        return `
          <div class="accordion ${sec.openByDefault ? "open" : ""}">
            <button class="accordion__header" type="button">
              <span>${sec.title}</span>
              <span class="chevron">▶</span>
            </button>
            <div class="accordion__body">
              ${body}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="subject-header">
          <h2>
            <span class="subject-icon">${subject.icon}</span>
            ${subject.title}
          </h2>
          <div class="progress" id="progress-${key}">
            <div class="progress__label">
              <span>Progresso da disciplina</span>
              <span class="progress__text">0 / ${subject.exercises.length}</span>
            </div>
            <div class="progress__bar">
              <div class="progress__fill"></div>
            </div>
          </div>
        </div>
        ${sectionsHtml}
      `;
    }

    /* =========================================================
       4. RENDERIZAÇÃO DE EXERCÍCIOS
       ========================================================= */
    function renderExercise(subjectKey, ex, index) {
      const exId = `${subjectKey}-ex-${index}`;
      if (ex.type === "multiple-choice") {
        const optionsHtml = ex.options.map((opt, i) => `
          <label class="option" data-index="${i}">
            <input type="radio" name="${exId}" value="${i}" />
            <span>${opt}</span>
          </label>
        `).join("");

        return `
          <div class="exercise" data-id="${exId}" data-type="multiple-choice"
               data-correct="${ex.correctAnswer}">
            <div class="exercise__label">Exercício ${index + 1} — Múltipla escolha</div>
            <div class="exercise__question">${ex.question}</div>
            <div class="options">${optionsHtml}</div>
            <div class="exercise__actions">
              <button class="btn btn--primary" data-action="check">Verificar resposta</button>
              <button class="btn btn--ghost" data-action="show-model">Mostrar resposta/modelo</button>
            </div>
            <div class="feedback"></div>
            <div class="model-answer">
              <h4>Resposta modelo</h4>
              <p>${ex.modelAnswer}</p>
            </div>
          </div>
        `;
      }

      if (ex.type === "short-answer") {
        return `
          <div class="exercise short-answer" data-id="${exId}" data-type="short-answer"
               data-keywords="${(ex.keywords || []).join("|")}">
            <div class="exercise__label">Exercício ${index + 1} — Resposta curta</div>
            <div class="exercise__question">${ex.question}</div>
            <textarea placeholder="Escreva sua resposta aqui..."></textarea>
            <div class="exercise__actions">
              <button class="btn btn--primary" data-action="check">Verificar resposta</button>
              <button class="btn btn--ghost" data-action="show-model">Mostrar resposta/modelo</button>
            </div>
            <div class="feedback"></div>
            <div class="model-answer">
              <h4>Resposta modelo</h4>
              <p>${ex.modelAnswer}</p>
            </div>
          </div>
        `;
      }

      return "";
    }

    /* =========================================================
       5. EVENTOS: ACCORDIONS, EXERCÍCIOS E VERIFICAÇÃO
       ========================================================= */
    function bindAccordions() {
      document.querySelectorAll(".accordion__header").forEach(header => {
        header.addEventListener("click", () => {
          header.parentElement.classList.toggle("open");
        });
      });
    }

    /* Alterna entre as visualizações "Resumo" e "Conteúdo geral"
       dentro da seção de Conteúdo. */
    function bindContentSwitch() {
      document.querySelectorAll(".content-switch").forEach(group => {
        const buttons = group.querySelectorAll(".content-switch__btn");
        const container = group.parentElement;
        buttons.forEach(btn => {
          btn.addEventListener("click", () => {
            const target = btn.dataset.view;
            buttons.forEach(b => {
              const isActive = b === btn;
              b.classList.toggle("active", isActive);
              b.setAttribute("aria-selected", isActive ? "true" : "false");
            });
            container.querySelectorAll(".content-view").forEach(v => {
              v.classList.toggle("active", v.dataset.view === target);
            });
          });
        });
      });
    }

    function bindExerciseEvents() {
      document.querySelectorAll(".exercise").forEach(exEl => {
        const type = exEl.dataset.type;

        if (type === "multiple-choice") {
          exEl.querySelectorAll(".option").forEach(opt => {
            opt.addEventListener("click", () => {
              exEl.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
              opt.classList.add("selected");
              const radio = opt.querySelector("input");
              if (radio) radio.checked = true;
            });
          });
        }

        exEl.querySelectorAll("[data-action]").forEach(btn => {
          btn.addEventListener("click", () => {
            const action = btn.dataset.action;
            if (action === "check") checkAnswer(exEl);
            if (action === "show-model") toggleModel(exEl);
          });
        });
      });
    }

    function checkAnswer(exEl) {
      const type = exEl.dataset.type;
      const feedback = exEl.querySelector(".feedback");
      const subjectKey = exEl.dataset.id.split("-ex-")[0];
      const exerciseId = exEl.dataset.id;

      // Recupera a explicação a partir do modelo de dados, sem depender do DOM.
      const indexMatch = exerciseId.match(/-ex-(\d+)$/);
      const exerciseIndex = indexMatch ? parseInt(indexMatch[1], 10) : null;
      const exerciseData = exerciseIndex !== null
        ? subjects[subjectKey].exercises[exerciseIndex]
        : null;

      // ---- Múltipla escolha ----
      if (type === "multiple-choice") {
        const selected = exEl.querySelector("input[type='radio']:checked");
        if (!selected) {
          showFeedback(feedback, "info", "Selecione uma alternativa antes de verificar.");
          return;
        }

        const correctIndex = parseInt(exEl.dataset.correct, 10);
        const chosen = parseInt(selected.value, 10);
        const isCorrect = chosen === correctIndex;

        exEl.querySelectorAll(".option").forEach(o => {
          o.classList.remove("correct", "incorrect");
        });
        const chosenOption = exEl.querySelector(`.option[data-index="${chosen}"]`);
        if (chosenOption) chosenOption.classList.add(isCorrect ? "correct" : "incorrect");

        if (isCorrect) {
          showFeedback(
            feedback, "success",
            `Você acertou! ${exerciseData ? exerciseData.explanation : ""}`
          );
        } else {
          showFeedback(
            feedback, "error",
            `Resposta incorreta. ${exerciseData ? exerciseData.explanation : ""}`
          );
        }

        registerAnswer(subjectKey, exerciseId, isCorrect);
        return;
      }

      // ---- Resposta curta ----
      if (type === "short-answer") {
        const textarea = exEl.querySelector("textarea");
        const answer = (textarea.value || "").toLowerCase().trim();

        if (!answer) {
          showFeedback(feedback, "info", "Escreva uma resposta antes de verificar.");
          return;
        }

        const keywords = (exEl.dataset.keywords || "")
          .split("|")
          .map(k => k.toLowerCase().trim())
          .filter(Boolean);

        const matched = keywords.filter(k => answer.includes(k));
        const ratio = keywords.length ? matched.length / keywords.length : 0;
        const isGood = ratio >= 0.5;

        if (isGood) {
          showFeedback(
            feedback, "success",
            `Boa resposta! Você mencionou ideias importantes${
              matched.length ? " (" + matched.join(", ") + ")" : ""
            }.`
          );
        } else {
          showFeedback(
            feedback, "error",
            "Sua resposta pode melhorar. Veja a resposta modelo para comparar."
          );
        }

        registerAnswer(subjectKey, exerciseId, isGood);
      }
    }

    function showFeedback(el, kind, message) {
      el.className = `feedback show feedback--${kind}`;
      el.textContent = message;
    }

    function toggleModel(exEl) {
      const model = exEl.querySelector(".model-answer");
      model.classList.toggle("show");
    }

    /* =========================================================
       6. PROGRESSO POR DISCIPLINA
       ========================================================= */
    function registerAnswer(subjectKey, exerciseId, isCorrect) {
      const state = progressState[subjectKey];
      state.answered.add(exerciseId);
      if (isCorrect) state.correct.add(exerciseId);
      else state.correct.delete(exerciseId);
      updateProgress(subjectKey);
    }

    function updateProgress(subjectKey) {
      const total = subjects[subjectKey].exercises.length;
      const correct = progressState[subjectKey].correct.size;
      const percent = total ? Math.round((correct / total) * 100) : 0;

      const wrap = document.getElementById(`progress-${subjectKey}`);
      if (!wrap) return;
      wrap.querySelector(".progress__text").textContent = `${correct} / ${total}`;
      wrap.querySelector(".progress__fill").style.width = `${percent}%`;
    }

    /* =========================================================
       7. SIMULADO DA PI
       Renderiza o painel completo com texto-base, blocos por
       disciplina e botões de finalizar/refazer.
       ========================================================= */
    function renderSimuladoPanel(sim) {
      // Agrupa as questões mantendo a ordem em que aparecem.
      const blocks = [];
      const blockIndex = new Map();
      sim.questions.forEach((q, i) => {
        if (!blockIndex.has(q.discipline)) {
          blockIndex.set(q.discipline, blocks.length);
          blocks.push({ discipline: q.discipline, items: [] });
        }
        blocks[blockIndex.get(q.discipline)].items.push({ ...q, _index: i });
      });

      const blocksHtml = blocks.map(b => `
        <div class="sim-block">
          <div class="sim-block__title">${b.discipline}</div>
          ${b.items.map(q => renderSimQuestion(q)).join("")}
        </div>
      `).join("");

      return `
        <div class="subject-header">
          <h2>
            <span class="subject-icon">${sim.icon}</span>
            ${sim.title}
          </h2>
        </div>

        <p style="color: var(--text-soft); margin-top: -6px;">${sim.intro}</p>

        <article class="sim-text">
          <h3>${sim.textTitle}</h3>
          ${sim.text}
        </article>

        <div class="sim-result" id="sim-result"></div>

        ${blocksHtml}

        <div class="sim-footer">
          <button class="btn btn--primary" id="sim-finalize">Finalizar simulado</button>
          <button class="btn btn--ghost"   id="sim-reset">Tentar novamente</button>
        </div>
      `;
    }

    function renderSimQuestion(q) {
      const optionsHtml = q.options.map((opt, i) => `
        <label class="sim-option" data-index="${i}">
          <input type="radio" name="sim-q-${q._index}" value="${i}" />
          <span>${opt}</span>
        </label>
      `).join("");

      return `
        <div class="sim-question"
             data-id="sim-q-${q._index}"
             data-correct="${q.correctAnswer}"
             data-discipline="${q.discipline}"
             data-explanation="${(q.explanation || '').replace(/"/g, '&quot;')}">
          <div class="sim-question__head">Questão ${q._index + 1} — ${q.discipline}</div>
          <div class="sim-question__text">${q.question}</div>
          <div class="sim-options">${optionsHtml}</div>
        </div>
      `;
    }

    function bindSimuladoEvents() {
      // Selecionar alternativa.
      document.querySelectorAll(".sim-question .sim-option").forEach(opt => {
        opt.addEventListener("click", () => {
          const q = opt.closest(".sim-question");
          q.querySelectorAll(".sim-option").forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          const radio = opt.querySelector("input");
          if (radio) radio.checked = true;
        });
      });

      const finalize = document.getElementById("sim-finalize");
      if (finalize) finalize.addEventListener("click", finalizeSimulado);

      const reset = document.getElementById("sim-reset");
      if (reset) reset.addEventListener("click", resetSimulado);
    }

    function finalizeSimulado() {
      const questions = document.querySelectorAll(".sim-question");
      const byDiscipline = {};
      let totalCorrect = 0;
      const total = questions.length;

      questions.forEach(q => {
        const d = q.dataset.discipline;
        if (!byDiscipline[d]) byDiscipline[d] = { correct: 0, total: 0 };
        byDiscipline[d].total += 1;

        const correctIdx = parseInt(q.dataset.correct, 10);
        const selected = q.querySelector("input[type='radio']:checked");

        // Limpa marcações anteriores antes de pintar de novo.
        q.querySelectorAll(".sim-option").forEach(o => {
          o.classList.remove("correct", "incorrect");
        });

        // Sempre destaca a alternativa correta em verde.
        const correctOpt = q.querySelector(`.sim-option[data-index="${correctIdx}"]`);
        if (correctOpt) correctOpt.classList.add("correct");

        if (selected) {
          const chosen = parseInt(selected.value, 10);
          const isCorrect = chosen === correctIdx;
          if (!isCorrect) {
            const chosenOpt = q.querySelector(`.sim-option[data-index="${chosen}"]`);
            if (chosenOpt) chosenOpt.classList.add("incorrect");
          } else {
            totalCorrect++;
            byDiscipline[d].correct++;
          }
        }
      });

      showSimuladoResult(totalCorrect, total, byDiscipline);
    }

    function showSimuladoResult(correct, total, byDiscipline) {
      const result = document.getElementById("sim-result");
      const percent = total ? Math.round((correct / total) * 100) : 0;

      let message;
      if (percent >= 80)      message = "Excelente! Você está muito bem preparado para a prova.";
      else if (percent >= 60) message = "Bom trabalho! Revise os pontos em que ficou em dúvida.";
      else if (percent >= 40) message = "Você já sabe boa parte. Volte aos resumos das disciplinas mais difíceis.";
      else                    message = "Vamos reforçar mais! Reabra as abas das disciplinas e tente de novo.";

      const breakdownHtml = Object.entries(byDiscipline).map(([d, s]) => {
        let cls = "sim-score--low";
        if (s.correct === s.total) cls = "sim-score--ok";
        else if (s.correct >= Math.ceil(s.total / 2)) cls = "sim-score--med";
        return `
          <div class="sim-score ${cls}">
            <span>${d}</span>
            <strong>${s.correct} / ${s.total}</strong>
          </div>
        `;
      }).join("");

      result.innerHTML = `
        <h3>Resultado do simulado</h3>
        <div class="sim-result__total">
          Você acertou <strong>${correct} de ${total}</strong> questões (${percent}%).
        </div>
        <p style="color: var(--text-soft); margin: 6px 0 0;">${message}</p>

        <h4>Pontuação por disciplina (0 a 3)</h4>
        <div class="sim-result__grid">${breakdownHtml}</div>
      `;
      result.classList.add("show");
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetSimulado() {
      document.querySelectorAll(".sim-question .sim-option").forEach(o => {
        o.classList.remove("selected", "correct", "incorrect");
        const r = o.querySelector("input");
        if (r) r.checked = false;
      });
      const result = document.getElementById("sim-result");
      if (result) {
        result.innerHTML = "";
        result.classList.remove("show");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================================
       8. INICIALIZAÇÃO
       ========================================================= */
    document.addEventListener("DOMContentLoaded", renderTabs);
  </script>
</body>
</html>
