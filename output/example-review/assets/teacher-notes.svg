<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Anotações da professora">
  <rect width="400" height="200" fill="#fffbeb"/>
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#92400e">Anotações da Professora</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#78350f">" Cilindro: 2 bases circulares</text>
  <text x="30" y="95" font-family="sans-serif" font-size="13" fill="#78350f">" Cone: 1 base circular + 1 vértice</text>
  <text x="30" y="120" font-family="sans-serif" font-size="13" fill="#78350f">" Esfera: nenhuma face plana</text>
  <text x="30" y="145" font-family="sans-serif" font-size="13" fill="#78350f">" Prisma: 2 bases iguais + faces laterais</text>
  <text x="30" y="175" font-family="sans-serif" font-size="11" fill="#a16207" font-style="italic">Cai na prova!</text>
</svg>
