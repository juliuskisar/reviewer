[project]
name = "school-review"
version = "1.0.0"
description = "Geração de páginas HTML estáticas de revisão escolar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["review_builder*"]

[project.scripts]
review-demo = "review_builder.demo:main"
review-compose = "review_builder.cli:compose_cmd"
review-audit = "review_builder.cli:audit_cmd"
review-package = "review_builder.cli:package_cmd"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
