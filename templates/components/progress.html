<div class="progress-tracker" role="region" aria-label="Progresso da revisão">
  <div class="progress-tracker__bar" aria-hidden="true">
    <div class="progress-tracker__fill" id="progress-fill"></div>
  </div>
  <p class="progress-tracker__label">
    Progresso: <span id="progress-percent">0</span>%
    <span class="visually-hidden" id="progress-status">Nenhuma seção concluída</span>
  </p>
</div>
