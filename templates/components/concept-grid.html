{% from "macros/locale.html" import locale_text %}
<div class="concept-grid" data-component="concept-grid">
  {% for card in block.content.cards %}
  <article class="concept-card">
    {% if card.icon %}<span class="concept-card__icon" aria-hidden="true">{{ card.icon }}</span>{% endif %}
    <h4>{{ locale_text(card, 'title', 'span') }}</h4>
    <p>{{ locale_text(card, 'text', 'span') }}</p>
  </article>
  {% endfor %}
</div>
