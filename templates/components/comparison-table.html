<div class="comparison-table-wrapper" data-component="comparison-table">
  <table class="comparison-table">
    <caption>{{ block.content.caption | default('Comparação') }}</caption>
    <thead>
      <tr>
        {% for header in block.content.headers %}
        <th scope="col">{{ header }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in block.content.rows %}
      <tr>
        {% for cell in row %}
        <td>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
